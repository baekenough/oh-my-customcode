name: Deploy Test

on:
  pull_request:
    branches:
      - develop

jobs:
  deploy-test:
    name: Deploy Test with Verdaccio
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start Verdaccio
        run: |
          npm install -g verdaccio
          verdaccio &
          sleep 5

      - name: Configure npm for Verdaccio
        run: |
          npm config set registry http://localhost:4873/
          # Verdaccio's default config requires an authenticated user to publish.
          # Register a throwaway user via the adduser API and use its real token.
          TOKEN=$(curl -s -X PUT \
            -H "Content-type: application/json" \
            -d '{"name":"test","password":"test1234"}' \
            http://localhost:4873/-/user/org.couchdb.user:test | jq -r '.token')
          npm config set //localhost:4873/:_authToken "$TOKEN"

      - name: Publish to Verdaccio
        run: |
          npm publish --ignore-scripts --registry http://localhost:4873/

      - name: Test global install
        run: |
          npm install -g oh-my-customcode --registry http://localhost:4873/

      - name: Test omcustom --version
        run: omcustom --version

      - name: Test omcustom --help
        run: omcustom --help

      - name: Test omcustom init (dry run)
        run: |
          # Create a test directory
          mkdir -p /tmp/test-project
          cd /tmp/test-project

          # Test init command (use echo to simulate user input or --help for now)
          omcustom init --help || echo "Init help displayed"

      - name: Cleanup
        if: always()
        run: |
          pkill -f verdaccio || true
