name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test:
    name: Test
    runs-on: macos-latest
    # Job-level permissions REPLACE the workflow-level block for this job (unlisted scopes = none), so the
    # three existing scopes are repeated unchanged; checks + actions: read serve "Detect tree already verified by PR CI".
    permissions:
      contents: write
      packages: write
      id-token: write
      checks: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 is required by "Detect tree already verified by PR CI" (second parent + ancestry check)
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Setup Node.js for npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome lint
        run: bun run lint

      # Skip the duplicate suite ONLY with proof that this exact tree already passed PR CI; any doubt => full suite.
      # Needs: Checkout fetch-depth: 0 (second parent + ancestry), the checks/actions read scopes above.
      # Couples to ci.yml: workflow "CI", job "Test", step "Run tests with coverage and check threshold".
      - name: Detect tree already verified by PR CI
        id: prverified
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fail-closed: every path below ends in `exit 0`; only the final line of the happy path writes skip=true.
          set +e
          run_suite() {
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::full test suite will run — $1"
            exit 0
          }
          command -v gh >/dev/null 2>&1 || run_suite "gh CLI not available"
          command -v jq >/dev/null 2>&1 || run_suite "jq not available"

          # 1) structural: GITHUB_SHA is a PR-merge commit ("<sha> <parent>..." has 3 fields for 2 parents, same test as ci.yml mergecheck)
          SHA="$(git rev-parse --verify "${GITHUB_SHA}^{commit}" 2>/dev/null)" || run_suite "cannot resolve ${GITHUB_SHA}"
          PARENTS="$(git rev-list --parents -n 1 "$SHA" 2>/dev/null | wc -w | tr -d ' ')"
          [ "$PARENTS" = "3" ] || run_suite "not a 2-parent merge commit (fields=$PARENTS)"
          P1="$(git rev-parse --verify "${SHA}^1^{commit}" 2>/dev/null)" || run_suite "first parent unavailable"
          P2="$(git rev-parse --verify "${SHA}^2^{commit}" 2>/dev/null)" || run_suite "second parent unavailable (shallow checkout?)"

          # 2) identical tree: the merge added nothing on top of the PR head
          TREE="$(git rev-parse --verify "${SHA}^{tree}" 2>/dev/null)" || run_suite "tree unavailable"
          P2_TREE="$(git rev-parse --verify "${P2}^{tree}" 2>/dev/null)" || run_suite "PR-head tree unavailable"
          [ -n "$TREE" ] && [ "$TREE" = "$P2_TREE" ] || run_suite "tree $TREE differs from PR-head tree $P2_TREE"

          # 3) PR head already contained the base (strict up-to-date), so CI's test-merge tree == PR-head tree
          git merge-base --is-ancestor "$P1" "$P2" 2>/dev/null || run_suite "base parent is not an ancestor of the PR head (PR was not up to date)"

          # 4) exactly one completed GitHub Actions (app 15368) check run named Test on the PR head, concluded success
          RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${P2}/check-runs?check_name=Test&app_id=15368&filter=latest&per_page=100")" || run_suite "check-runs lookup failed for PR head $P2"
          JOB_ID="$(printf '%s' "$RUNS" | jq -r --arg sha "$P2" '[.check_runs[] | select(.name == "Test" and .app.id == 15368 and .head_sha == $sha and .status == "completed")] | if length == 1 and .[0].conclusion == "success" then .[0].id else empty end')"
          case "$JOB_ID" in ''|*[!0-9]*) run_suite "no single completed successful Test check run on PR head $P2" ;; esac

          # 5) ci.yml reports Test=success on its docs-only fast path without running any test, so require the real test step itself to have succeeded
          JOB="$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}")" || run_suite "job lookup failed for check run $JOB_ID"
          STEP_OK="$(printf '%s' "$JOB" | jq -r --arg sha "$P2" 'select(.workflow_name == "CI" and .name == "Test" and .head_sha == $sha and .conclusion == "success") | [.steps[] | select(.name == "Run tests with coverage and check threshold" and .conclusion == "success")] | length')"
          [ "$STEP_OK" = "1" ] || run_suite "PR-head Test job $JOB_ID did not run the real test step to success (docs-only fast path, or step renamed in ci.yml)"

          echo "::notice::tree $TREE already passed PR CI (PR head $P2, Test job $JOB_ID) — skipping duplicate test run"
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Run tests with coverage
        if: steps.prverified.outputs.skip != 'true'
        run: bun test --coverage

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-output
          path: |
            dist/
            packages/*/dist/
            packages/*/build/
          retention-days: 1

  docs-validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run documentation validation
        run: bun run .github/scripts/validate-docs.ts --programmatic-only

  publish:
    name: Publish
    needs: [test, docs-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js for npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-output

      - name: Verify build artifacts
        run: |
          test -f dist/index.js || { echo "::error::Missing dist/index.js"; exit 1; }
          echo "Build artifacts verified"

      - name: Verify template sync
        run: bash .github/scripts/verify-template-sync.sh

      - name: Verify version sync (package.json vs templates/manifest.json)
        run: bash .github/scripts/verify-version-sync.sh

      # Check if version already exists on npm
      - name: Check npm version
        id: npm_check
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this version already exists on npm
          if npm view oh-my-customcode@$VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION already exists on npm, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Publish to npm (skip if already exists)
      - name: Publish to npm
        if: steps.npm_check.outputs.exists == 'false'
        run: |
          npm publish --ignore-scripts --provenance --access public --tag latest 2>&1 || {
            EXIT_CODE=$?
            # Check if failure is due to version already existing (race condition with local publish)
            if npm view oh-my-customcode@${{ steps.npm_check.outputs.version }} version 2>/dev/null; then
              echo "::notice::Version ${{ steps.npm_check.outputs.version }} was published externally (race condition). Continuing."
            else
              exit $EXIT_CODE
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Re-configure for GitHub Packages
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@baekenough'

      # Check if version already exists on GitHub Packages
      - name: Check GitHub Packages version
        id: ghp_check
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          # Check if this version already exists on GitHub Packages
          if npm view @baekenough/oh-my-customcode@$VERSION version --registry=https://npm.pkg.github.com 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION already exists on GitHub Packages, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to GitHub Packages (skip if already exists)
      - name: Publish to GitHub Packages
        if: steps.ghp_check.outputs.exists == 'false'
        run: |
          # Update package name for GitHub Packages (scoped)
          jq '.name = "@baekenough/oh-my-customcode" | .publishConfig = {"registry": "https://npm.pkg.github.com", "access": "public"}' package.json > package.json.tmp && mv package.json.tmp package.json
          npm publish --ignore-scripts 2>&1 || {
            EXIT_CODE=$?
            # Check if failure is due to version already existing (race condition with local publish)
            VERSION=${GITHUB_REF#refs/tags/v}
            if npm view @baekenough/oh-my-customcode@$VERSION version --registry=https://npm.pkg.github.com 2>/dev/null; then
              echo "::notice::Version $VERSION was published externally (race condition). Continuing."
            else
              exit $EXIT_CODE
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Restore package.json (only if we modified it)
      - name: Restore package.json
        if: steps.ghp_check.outputs.exists == 'false'
        run: git checkout package.json

      # Extract changelog for this version (with graceful fallback)
      - name: Extract Release Notes
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check for CHANGELOG.md
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found. Will use auto-generated release notes."
            echo "notes=" >> $GITHUB_OUTPUT
            echo "has_changelog=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract changelog section for this version
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::notice::CHANGELOG.md is deprecated (v1.1.14+); using auto-generated release notes as the single source of truth (expected, per #1503)."
            echo "notes=" >> $GITHUB_OUTPUT
            echo "has_changelog=false" >> $GITHUB_OUTPUT
          else
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changelog=true" >> $GITHUB_OUTPUT
            echo "::notice::Found changelog entry for v${VERSION}"
          fi

      # Create GitHub Release with changelog or auto-generated notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.notes || '_Auto-generated release notes (CHANGELOG.md entry missing)_' }}

            ---

            ### Installation

            ```bash
            # npm
            npm install oh-my-customcode@${{ steps.changelog.outputs.version }}

            # or use npx
            npx oh-my-customcode@${{ steps.changelog.outputs.version }} init
            ```

            ### Links
            - [npm package](https://www.npmjs.com/package/oh-my-customcode/v/${{ steps.changelog.outputs.version }})
            - [GitHub Package](https://github.com/baekenough/oh-my-customcode/pkgs/npm/oh-my-customcode)
          generate_release_notes: ${{ steps.changelog.outputs.has_changelog != 'true' }}
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  recover-patch-release:
    name: Recover Patch Release
    needs: [publish]
    if: github.ref == 'refs/tags/v1.1.107'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js for npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Restore patch latest and remove mistaken major version
        shell: bash
        run: |
          set -euo pipefail
          registry='https://registry.npmjs.org/'
          published=$(npm view oh-my-customcode@1.1.107 version --registry="$registry" --prefer-online)
          if [ "$published" != '1.1.107' ]; then
            echo '::error::Patch 1.1.107 is not available; refusing recovery'
            exit 1
          fi

          npm dist-tag add oh-my-customcode@1.1.107 latest --registry="$registry"
          latest=$(npm view oh-my-customcode dist-tags.latest --registry="$registry" --prefer-online)
          if [ "$latest" != '1.1.107' ]; then
            echo '::error::latest does not point to 1.1.107; refusing unpublish'
            exit 1
          fi

          has_mistaken_version() {
            npm view oh-my-customcode versions --json --registry="$registry" --prefer-online |
              node -e 'let input = ""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const versions = JSON.parse(input); if (!Array.isArray(versions) || !versions.every(version => typeof version === "string")) throw new Error("Invalid npm versions response"); console.log(versions.includes("2.0.0") ? "true" : "false"); });'
          }
          mistaken=$(has_mistaken_version)
          if [ "$mistaken" = 'true' ]; then
            npm unpublish oh-my-customcode@2.0.0 --registry="$registry"
          else
            echo '::notice::Version 2.0.0 is already absent; unpublish skipped'
          fi

          mistaken=$(has_mistaken_version)
          if [ "$mistaken" != 'false' ]; then
            echo '::error::Version 2.0.0 is still published'
            exit 1
          fi
          latest=$(npm view oh-my-customcode dist-tags.latest --registry="$registry" --prefer-online)
          if [ "$latest" != '1.1.107' ]; then
            echo '::error::latest changed during recovery'
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-release:
    name: Verify Release
    needs: [publish]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify npm publish
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MAX_ATTEMPTS=20
          for i in $(seq 1 $MAX_ATTEMPTS); do
            PUBLISHED=$(npm view oh-my-customcode@${VERSION} version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "✓ npm: oh-my-customcode@${VERSION} confirmed"
              exit 0
            fi
            echo "Attempt $i/${MAX_ATTEMPTS}: not visible yet, waiting 30s..."
            sleep 30
          done
          echo "> **npm propagation:** ⚠️ not visible within 10m — publish succeeded upstream; re-check with \`npm view oh-my-customcode@${VERSION} version\`" >> $GITHUB_STEP_SUMMARY
          echo "::error::npm package not found after ${MAX_ATTEMPTS} attempts (~10m): oh-my-customcode@${VERSION}"
          exit 1

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@baekenough'

      - name: Verify GitHub Packages publish
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MAX_ATTEMPTS=20
          for i in $(seq 1 $MAX_ATTEMPTS); do
            NPM_ERR=$(mktemp)
            PUBLISHED=$(npm view @baekenough/oh-my-customcode@${VERSION} version \
              --registry=https://npm.pkg.github.com 2>"$NPM_ERR" || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "✓ GitHub Packages: @baekenough/oh-my-customcode@${VERSION} confirmed"
              rm -f "$NPM_ERR"
              exit 0
            fi
            if grep -qE 'E401|E403' "$NPM_ERR"; then
              echo "::warning::GitHub Packages auth failure ($(grep -oE 'E40[13]' "$NPM_ERR" | head -1)) verifying @baekenough/oh-my-customcode@${VERSION} — check NODE_AUTH_TOKEN/registry setup, not retrying"
              cat "$NPM_ERR"
              echo "> **GitHub Packages auth failure:** ⚠️ $(grep -oE 'E40[13]' "$NPM_ERR" | head -1) verifying @baekenough/oh-my-customcode@${VERSION} — check NODE_AUTH_TOKEN/registry setup; re-check with \`npm view @baekenough/oh-my-customcode@${VERSION} version --registry=https://npm.pkg.github.com\`" >> $GITHUB_STEP_SUMMARY
              rm -f "$NPM_ERR"
              exit 0
            fi
            rm -f "$NPM_ERR"
            echo "Attempt $i/${MAX_ATTEMPTS}: not visible yet, waiting 30s..."
            sleep 30
          done
          echo "> **GitHub Packages propagation:** ⚠️ not visible within 10m — publish succeeded upstream; re-check with \`npm view @baekenough/oh-my-customcode@${VERSION} version --registry=https://npm.pkg.github.com\`" >> $GITHUB_STEP_SUMMARY
          echo "::warning::GitHub Package not found after ${MAX_ATTEMPTS} attempts (~10m) (eventual consistency — package will appear later)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Release
        run: |
          VERSION=${{ steps.version.outputs.version }}
          RELEASE=$(gh api repos/${{ github.repository }}/releases/tags/v${VERSION} \
            --jq '.tag_name' 2>/dev/null || true)
          if [ "$RELEASE" = "v${VERSION}" ]; then
            echo "✓ GitHub Release: v${VERSION} confirmed"
          else
            echo "::error::GitHub Release not found for v${VERSION}"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "## Release Verification: v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          NPM=$(npm view oh-my-customcode@${VERSION} version 2>/dev/null || echo "NOT FOUND")
          GHP=$(npm view @baekenough/oh-my-customcode@${VERSION} version \
            --registry=https://npm.pkg.github.com 2>/dev/null || echo "NOT FOUND")
          GHR=$(gh api repos/${{ github.repository }}/releases/tags/v${VERSION} \
            --jq '.tag_name' 2>/dev/null || echo "NOT FOUND")
          echo "| npm | ${NPM} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Packages | ${GHP} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${GHR} |" >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
