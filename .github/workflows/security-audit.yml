name: Security Audit

on:
  # Weekly audit every Monday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
  # Also run on PRs to catch new vulnerabilities
  pull_request:
    branches:
      - develop
      - 'release/**'
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        id: audit
        run: |
          # bun audit, not npm audit: npm cannot resolve `workspace:*` dependencies
          # Ignore GHSA-587h-7wmj-h5pm: vitepress 1 pins vite ^5 and no fixed 5.x exists;
          # dev-server/Windows-only advisory. Drop the ignore once vitepress moves to a fixed vite.
          # bun 1.3.14 prints "<Error>: audit request failed" (also "... (status 500)") on request failure
          # and an "N vulnerabilities (" summary line when it found advisories.
          for attempt in 1 2 3; do
            rc=0
            out=$(bun audit --audit-level=high --ignore=GHSA-587h-7wmj-h5pm 2>&1) || rc=$?
            echo "$out"
            [ "$rc" -eq 0 ] && exit 0
            # strip ANSI colors (FORCE_COLOR=1 wraps "N vulnerabilities" in escapes; NO_COLOR does not override it)
            out="$(printf '%s' "$out" | LC_ALL=C sed $'s/\033\\[[0-9;]*m//g')"
            if [[ "$out" == *[0-9]" vulnerabilities ("* ]]; then
              echo "::error::Security vulnerabilities found. Please update dependencies."
              exit 1
            fi
            if [[ "$out" != *"audit request failed"* ]]; then
              echo "::error::Security audit did not complete (exit $rc); no audit result."
              exit 1
            fi
            echo "::warning::Audit request failed (attempt $attempt/3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "::error::Audit request failed after 3 attempts (registry unreachable); no audit result."
          exit 1

      - name: Notify on failure
        if: failure() && steps.audit.outcome == 'failure'
        run: echo "Security audit step failed; see its log for the cause. Run 'bun audit' locally for details."
