name: cc-release-monitor

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  MIN_PATCH: "151"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Claude Code releases and create issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MIN_PATCH: ${{ env.MIN_PATCH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import re
          import subprocess
          import sys
          import textwrap
          import urllib.error
          import urllib.request

          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          MIN_PATCH = int(os.environ.get("MIN_PATCH", "151"))
          ANTHROPIC_API_KEY = os.environ.get("ANTHROPIC_API_KEY", "")

          print(f"=== cc-release-monitor: fetching Claude Code releases ===")
          print(f"MIN_PATCH={MIN_PATCH}")


          def translate_to_korean(body_raw):
              """Translate a Claude Code release body to Korean via the Anthropic
              Messages API. Returns None (graceful degradation, R004) on any
              failure — missing key, network error, bad status, or malformed
              response."""
              if not ANTHROPIC_API_KEY:
                  print("WARNING: translation failed: ANTHROPIC_API_KEY not set", file=sys.stderr)
                  return None

              prompt = (
                  "다음은 Claude Code 릴리즈 노트(What's Changed)입니다. "
                  "한국어로 100% 번역하세요. 단, 코드 식별자·CLI 플래그·설정 키·모델 ID·파일 경로 등 "
                  "기술 용어는 원문 그대로 유지하고, 마크다운 구조(불릿, 헤더)를 보존하세요. "
                  "번역문만 출력하고 다른 설명은 붙이지 마세요.\n\n---\n\n" + body_raw
              )

              payload = json.dumps({
                  "model": "claude-haiku-4-5",
                  "max_tokens": 2000,
                  "messages": [{"role": "user", "content": prompt}],
              }).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=payload,
                  headers={
                      "x-api-key": ANTHROPIC_API_KEY,
                      "anthropic-version": "2023-06-01",
                      "content-type": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      resp_body = resp.read().decode("utf-8")
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as e:
                  print(f"WARNING: translation failed: {e}", file=sys.stderr)
                  return None

              try:
                  data = json.loads(resp_body)
                  text = data["content"][0]["text"]
              except (json.JSONDecodeError, KeyError, IndexError, TypeError) as e:
                  print(f"WARNING: translation failed: {e}", file=sys.stderr)
                  return None

              if not text:
                  print("WARNING: translation failed: empty response", file=sys.stderr)
                  return None

              return text

          # ── Step 1: fetch all releases from anthropics/claude-code ──────────
          result = subprocess.run(
              ["gh", "api", "repos/anthropics/claude-code/releases", "--paginate"],
              capture_output=True,
              text=True,
              env=os.environ,
          )
          if result.returncode != 0:
              print(f"ERROR: gh api failed: {result.stderr.strip()}", file=sys.stderr)
              sys.exit(1)

          try:
              releases = json.loads(result.stdout)
          except json.JSONDecodeError as e:
              print(f"ERROR: Failed to parse releases JSON: {e}", file=sys.stderr)
              sys.exit(1)

          # ── Step 2: filter — v2.1.NNN, no nightly, patch >= MIN_PATCH ───────
          pattern = re.compile(r"^v2\.1\.(\d+)$")
          candidates = []
          for r in releases:
              tag = r.get("tag_name", "")
              if "nightly" in tag.lower():
                  continue
              m = pattern.match(tag)
              if not m:
                  continue
              if int(m.group(1)) < MIN_PATCH:
                  continue
              candidates.append({
                  "tag": tag,
                  "published_at": r.get("published_at", ""),
                  "html_url": r.get("html_url", ""),
                  "body": (r.get("body") or "").strip(),
              })

          print(f"Found {len(candidates)} candidate release(s) matching filter.")

          if not candidates:
              print("Nothing to do.")
              sys.exit(0)

          # ── Step 3: dedup and create ─────────────────────────────────────────
          created = 0
          skipped = 0

          for release in candidates:
              version = release["tag"]          # e.g. "v2.1.151"
              published_at = release["published_at"]
              html_url = release["html_url"]
              body_raw = release["body"]

              issue_title = f"Claude Code {version}"

              # Dedup: exact title match among all issues (open + closed)
              check = subprocess.run(
                  [
                      "gh", "issue", "list",
                      "--repo", REPO,
                      "--state", "all",
                      "--search", issue_title,
                      "--json", "title",
                  ],
                  capture_output=True,
                  text=True,
                  env=os.environ,
              )
              if check.returncode != 0:
                  print(
                      f"WARNING: issue list failed for {version}: {check.stderr.strip()}",
                      file=sys.stderr,
                  )
                  skipped += 1
                  continue

              existing = json.loads(check.stdout or "[]")
              if any(i["title"] == issue_title for i in existing):
                  print(f"SKIP  {version} — issue already exists")
                  skipped += 1
                  continue

              # Truncate release body, then translate the truncated original to Korean
              MAX_BODY = 4000
              if not body_raw:
                  body_truncated = ""
                  translated = None
                  summary_text = "_릴리즈 노트가 제공되지 않았습니다._"
              else:
                  if len(body_raw) > MAX_BODY:
                      body_truncated = body_raw[:MAX_BODY] + "... (truncated)"
                  else:
                      body_truncated = body_raw
                  translated = translate_to_korean(body_truncated)
                  summary_text = (
                      translated
                      if translated is not None
                      else "_자동 번역에 실패했습니다. 아래 원문을 참고하세요._"
                  )

              if body_raw:
                  original_block = textwrap.dedent(f"""\

                      <details>
                      <summary>🔤 원문 (What's Changed)</summary>

                      {body_truncated}

                      </details>
                      """)
              else:
                  original_block = ""

              issue_body = textwrap.dedent(f"""\
                  # Claude Code {version}

                  **Release:** {version}
                  **Published:** {published_at}
                  **Link:** {html_url}

                  ## 릴리즈 요약 (한국어)

                  {summary_text}
                  """) + original_block + textwrap.dedent("""\

                  ---

                  ## 액션 아이템

                  - [ ] oh-my-customcode 영향도 관점에서 릴리즈 노트 검토
                  - [ ] 새 Claude Code 기능이 에이전트에 영향을 주면 에이전트 정의 갱신
                  - [ ] 현재 oh-my-customcode 버전과의 호환성 테스트
                  - [ ] 새 기능이 관련되면 CLAUDE.md 갱신

                  ---

                  _이 이슈는 cc-release-monitor GitHub Actions 워크플로우가 자동 생성했습니다._\
              """)

              create = subprocess.run(
                  [
                      "gh", "issue", "create",
                      "--repo", REPO,
                      "--title", issue_title,
                      "--body", issue_body,
                      "--label", "automated,claude-code-release",
                  ],
                  capture_output=True,
                  text=True,
                  env=os.environ,
              )
              if create.returncode != 0:
                  print(
                      f"ERROR  {version} — create failed: {create.stderr.strip()}",
                      file=sys.stderr,
                  )
                  skipped += 1
                  continue

              issue_url = create.stdout.strip()
              print(f"CREATE {version} — {issue_url}")
              created += 1

          print()
          print(f"=== Summary: {created} created, {skipped} skipped ===")
          PYEOF
