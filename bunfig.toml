[install]
# Faster installs
auto-install-peers = true
# Explicit isolated linker (bun.lock configVersion 1 default) — packages/serve relies on per-package dependency isolation
linker = "isolated"

[test]
# Coverage configuration
coverage = true
coverageDir = "coverage"
coverageReporter = ["text", "lcov"]
# CI tooling, not shipped code — exclude from the coverage gate.
coveragePathIgnorePatterns = [".github/**"]

[run]
# Bun runtime options
smol = true
