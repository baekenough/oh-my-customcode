        #1778 찐빠 #5). 동일 하네스의 측정 가능한 uncovered line 집합과 파일별 function
        deficit를 기준선과 비교하고 새 미커버 line·function deficit 증가가 없어야 합니다.
        isolation 수정 뒤의 touched 파일 결과는 전체 suite에서 읽으십시오. FN/FNDA identity가
        실제 제공되는 하네스에서만 함수 식별자 집합을 비교하십시오. 현재 LCOV가 DA 및 FNF/FNH만
        제공하면 exact uncovered lines와 파일별 FNF-FNH를 기록하고 함수 identity 동일성은
        미검증이라고 명시하십시오. deficit 계수로 identity 보존을 증명했다고 말하지 마십시오.
        작아진 denominator만으로 생긴 percentage 하락은 실패 근거가 아니며 새 파일은 baseline이
        없어 측정 가능한 전체 uncovered lines/deficit를 보고하십시오. 직접 src 변경이 없는
        global test 수정도 All-files 비교를 면제하지 말고 대상 src 집합이 빈 이유를 적으십시오
        (#1807 제안 3, 현재 하네스 관측 한계).
      - Delegations that inject faults / modify-then-restore files — not limited to harness
        builds — MUST back up the original file under `bak/<repo-relative-path>` (the full
        repo-relative path, not filename-only) nested under the session scratchpad or `$TMPDIR`
        (not inside the repo, to stay consistent with constraint (h) above), and a checksum
        comparison after restore is MANDATORY. A `git diff`-based patch approach is also allowed.
        `git stash` is otherwise allowed EXCEPT when parallel delegations share the working tree
        (R009 「File-Disjoint ≠ Independent (Local Git State)」), where it MUST NOT be used
        (#1733 코멘트 찐빠 #8).
      - For `claude-code-release` issues, CC release knowledge goes to
        `guides/claude-code/15-version-compatibility.md` (+ templates mirror) per rule; a rule
        file gets at most ONE line of behavioral norm only when agent behavior must change.
        Delegations correcting a CC-note (a note the issue claims is wrong) MUST enclose the
        upstream CHANGELOG lines (before extracting them, confirm the quotation unit: write each
        quotation on its own line of a file made with the Write tool and check EACH one with the
        quote-verify block under constraint (c), reading the count per quotation; a combined
        file-pattern match passes when any single quotation matches, #1831 F1) and the original target paragraph
        as ground truth; if the issue's premise differs from the primary source, the primary
        source wins and the discrepancy is reported rather than silently inherited into the
        corrected wording (#1730 찐빠 #1). A `claude-code-release` delegation prompt that writes
        a count sentence (e.g. "기타 N건") MUST specify, in the prompt itself, the exact counting
        range (which section of the issue body to count) and the exact measurement command; the
        resulting guide/rule text MUST carry that same command alongside the number — delegations
        that produce no count sentence are excluded (계수 구간 정의 부재로 인한 수치 오류 방지,
        R023 「리서치 위임의 결론 수치는 표에서 재계산해 병기」, R020, #1749 찐빠 #2).
      - A `claude-code-release` delegation's quotation verification MUST run the quote-verify block of the fixed constraint (c) (quotations in a file written
        with the Write tool) with `<target-file>` set to a
        file cut to that version's CHANGELOG section only, never the whole CHANGELOG (example
        cut, `<X.Y.Z>` is a placeholder: `awk -v v="<X.Y.Z>" '/^## /{p=($2==v)} p'
        CHANGELOG.md > <section-file>`; an empty <section-file> means the version is absent and
        the delegation MUST stop and report) (인용 검증 대상은 해당 버전 절만 잘라낸 파일로
        지정합니다 — 원문에 있는지와 이 버전의 원문인지를 같은 검사로 취급하면 다른 버전
        문장이 섞여도 통과하므로, #1757 찐빠 #4).
        For a bundled multi-version note (R017 「묶음 버전 노트 위임서 — 문장별 (NNN) 태그와 합쇼체 예시」), cut one section file per version and verify each quote against its own version's file.
      - Any delegation correcting a fact (the issue states an existing statement in a target file
        is wrong) — not only `claude-code-release` CC-notes — MUST include, as a completion
        criterion, an exhaustive `grep` across the target file(s) for the claim's key terms (the terms in a file written with the Write tool, run through the quote-verify block of the fixed constraint (c) as a search, not a pass/fail check), not
        only the single string anchor supplied in the prompt, so a second copy of the same claim
        elsewhere in the file is also caught; the completion report MUST give a per-key-term count table (the block's per-line
        output may serve as the table, and its return code is NOT used as a verdict here) and name every key term whose count is 0 — this is a report, not a failure verdict; pure additions (no existing statement is being
        corrected) are excluded (앵커 1개 한정으로 인한 동일 주장 잔존 사본 방지, R010 「출처
        인용과 인접 문구 점검」, R022, #1749 찐빠 #4).
      - When review-correction work is split across file-ownership delegations (one file per
        agent), every split delegation prompt MUST carry the FULL list of review findings
        (not only the subset touching that agent's file) as a self-check list, so a fix in one
        file does not reintroduce a defect the review flagged in a sibling file (#1730 찐빠
        #2).
      - Delegations adding visible text to `CLAUDE.md`/`.claude/rules/*.md` MUST keep the
        comment-stripped total ≤140,000 chars (hard limit 150,000, validate-docs
        `--programmatic-only`) — retire/DETAIL-wrap something else in-change if needed (R016
        버전노트 보존정책 / 예산 게이트, #1717). Any delegation that compresses or conceals rule
        text (DETAIL-wrapping, retirement) MUST deterministically confirm that every visible
        approval/prohibition/MUST sentence present in the file at HEAD is semantically still
        present in the new visible text afterwards (의미상 남았는가) — a visible-text-to-visible-
        text comparison, not a summary-vs-summary one, using a deterministic method: per-sentence
        check: write the key phrases from each of HEAD's visible approval/prohibition/MUST sentences
        to a file with the Write tool (one phrase per line), then run the quote-verify block of the fixed constraint (c)
        with `<target-file>` set to a new comment-stripped text file; an inline `grep -F "…"` with typed phrases is
        forbidden (#1722 찐빠 #1; #1831 F10, the shell runs a backticked code span inside a double-quoted phrase as a command).


      ## Sensitive Path Handling (CC v2.1.121+)

      Direct Write/Edit/Bash on `.claude/**` is permitted under the `bypassPermissions` permission mode as of CC v2.1.121 (#1101). The legacy `/tmp/*.sh` bypass is no longer required. Structural changes (new agents/skills) still go through mgr-creator with R017 verification.

      For CC < v2.1.121 see git history for the legacy bypass pattern.

      ## Local CI-mimic verification (MUST run before marking implement done)

      구현 작업 뒤 아래 CI 대응 검사를 순차 실행하십시오. 각 명령을 standalone으로 실행하고
      raw log와 직접 exit code를 읽으십시오. pipe 뒤 `$?`를 원 명령 결과로 쓰지 마십시오(R005, #1492).

      1. bash .github/scripts/verify-template-sync.sh
      2. bash .github/scripts/verify-wiki-sync.sh
      3. bun .github/scripts/validate-docs.ts --programmatic-only

      ## Early wiki result classification and handoff

      QA 검증 담당자는 wiki 검사 raw log/exit code, 실제 checker structured diagnostics,
      source/entity 변경 목록과 비교한 실패별 분류 표를 제출하십시오. implement dispatcher는
      각 실패의 원 producer·원 보장·reader·다음 조치를 읽고 아래 분기로 처리하십시오.
      wrapper가 hash drift에서 먼저 종료하면 link 검사 성공을 추정하지 말고 같은 checker를
      별도로 실행하여 runtime/I/O 실패 여부와 link 진단을 수집하십시오. 이 실행은 분류 근거이며
      wrapper 전체 PASS를 대신하지 않습니다. infra-unavailable warning도 성공으로 취급하지 마십시오.

      | 실패 분류 / 원 보장 | Producer | Reader / 조치 |
      |---|---|---|
      | 기존 문서의 분류된 link/hash/content drift / review-first wiki 작성 | 기존 wiki 페이지·source hash·checker link 진단 | implement dispatcher는 실패를 pending-documentation으로 기록하고 Source gate and wiki handoff에 표와 raw 근거를 넘기십시오. |
      | 새 entity의 누락 페이지 및 page/count floor / CI entity 완전성 | entity/page/index 생성 담당자·기존 CI 검사 | implement dispatcher는 즉시 HALT하고 wiki-curator에 /omcustom:wiki ingest <path>로 누락 페이지를 맡기십시오. 페이지/count floor를 복구한 뒤 영향을 받은 검사를 다시 실행하십시오. |
      | runtime/tool/dependency/parser/metadata/I/O/infra 실패 또는 미분류 오류 / fail closed | checker·filesystem·toolchain·CI adapter | implement dispatcher는 즉시 HALT하고 해당 소유 담당자에게 원 log와 실패를 넘기십시오. 문서 drift로 바꾸어 유예하지 마십시오. |
      | template sync 및 validate-docs 실패 / mirror·전역 count floor | template/count producer | implement dispatcher는 mgr-updater에 sync 또는 .en/.ko variant와 secondary docs를 포함한 EXHAUSTIVE 문서 count 정정을 맡기고 영향 검사를 재실행하십시오(#1521). |

      pending-documentation 분기는 docs-only/lite/standard와 code/test+text 혼합 범위 모두에
      적용하십시오(#1688 review-first ordering). 기존 문서의 link/hash/content drift라는 근거가
      있는 결과만 유예하고 실패 유형이 섞이면 즉시 HALT 대상부터 해결하십시오. 새 entity 페이지
      누락은 유예하지 마십시오. template/count 검사 등 나머지 CI floor는 그대로 통과해야 합니다.
      분류 표가 없거나 원인을 구분할 수 없으면 implement 완료를 HALT하십시오.
      implement 완료 보고에는 pending-documentation을 미완료 검증으로 명시하십시오. 이 상태는
      verify-build와 source 정정·Sauron으로 진행할 수 있는 handoff이며 CI 전체 green이 아닙니다.
      조기 wiki resync/reseed로 리뷰 순서를 앞당기지 마십시오. Source gate and wiki handoff의
      mandatory source Sauron 뒤 wiki-curator가 분류된 drift를 정정하고, Post-wiki deterministic
      verification의 QA가 분류 표 모든 행과 실제 CI 전체 대응 검사 PASS를 읽어 닫게 하십시오.
      최종 미해결 행·검사 실패·증거 누락은 commit/release를 HALT합니다. 같은 입력에서 이미
      유효한 CI 대응 결과만 재사용하며 wiki/source 정정으로 무효화된 검사는 다시 실행하십시오.
      source-hash reseed 대상은 항상 wiki/.source-hashes.json이며 templates/manifest.json이
      아닙니다. 페이지 정정 뒤 bash .github/scripts/lib/source-hash.sh generate
      wiki/.source-hashes.json을 실행하십시오(Ref #1423). 원 보장을 생략하는 waiver나 checker
      ignore list를 만들지 마십시오. 이 분기는 기존 1–2회 push 왕복을 막는 CI-mimic 목적을
      유지하면서 최종 CI floor와 review-first 순서를 함께 보존합니다(Ref #927).
    description: "Per-issue implementation with lifecycle, specialist routing, and CI-mimic verification"
    depends_on: deep-plan

  - name: verify-build
    prompt: |
      Project-specific build + test verification.

      For Node/Bun projects (this repo):
      1. frozen-lockfile install로 lockfile 정합을 확인하고 drift이면 중단하십시오. 새 dependency
         변경 소유자의 설치/audit 결과와 CI의 실제 대응 명령을 읽으며 install script 정책을 보존하십시오.
      2. bun run lint (if package.json has lint script)
      3. bun run typecheck (if available)
      4. bun test — MANDATORY, no silent skip
         아래 Owned hook-like coverage verification 조건의 `bun test --coverage` 한 직렬 실행을
         이 test gate와 item 6 coverage gate에 함께 사용하십시오. 같은 입력 상태의 전체 suite를
         bun test와 coverage로 중복 실행하지 마십시오. 실제 pre-commit은 별도 필수 실행입니다.
         - Baseline reference: #1156 historically documented 86 failures; v0.136.2 fixes resolved them → current baseline = 0
         - Each release: adopt prior version's test result as baseline (dynamic, not hardcoded)
         - Compute current pass/fail counts
         - If current FAIL count > baseline → NEW regression detected → halt + report failure list
         - If current FAIL count <= baseline → continue with advisory log "X failures (baseline {n}, delta {d})"
      5. Build verification (if package has build script)
      6. Coverage threshold check (equivalent to `.husky/pre-commit`'s coverage gate — this
         step exists so that a deferred implement-stage commit, per the implement step 5
         REQUIRED ordering, is still coverage-gated before release even though the hook has not run yet):
         - item 4의 동일 상태 coverage raw log와 직접 읽은 exit를 재사용하십시오. build/item 5 등으로
           시험 입력이 바뀌면 stale 결과를 사용하지 말고 영향 항목을 재검증하십시오. NO pipe로
           읽은 exit·pass/fail·All files coverage와 입력 fingerprint를 같은 보고에 기록하십시오.
         - Extract Function/Line coverage from the "All files" summary line
         - Read the CURRENT threshold value and the new-source-file relaxation rule directly
           from `.husky/pre-commit` at run time — do NOT hardcode a threshold number in this
           workflow; the hook's threshold can change independently of this file
         - If either Function or Line coverage falls below the threshold `.husky/pre-commit`
           currently applies (accounting for its dynamic relaxation for commits containing
           newly added `src/**/*.ts`/`.tsx` files): halt + report the shortfall

      ## Owned hook-like coverage verification

      verify-build dispatcher는 QA 한 소유자에게 직렬 실행을 위임하십시오. QA는 real HOME을
      바꾸지 않고 자식 env에 고유 fake HOME/TMPDIR를 전달하십시오. 실제 소스 상태와 시험 입력의
      fingerprint·Git/Bun 조건·원본 log를 기록하고 결과를 dispatcher가 item 4/6에서 읽게 하십시오.
      fingerprint는 source/test/config/dependency 입력의 path·hash manifest로 기록하며 tracked
      파일뿐 아니라 이번 생성 untracked 대상도 포함하십시오. 제외 입력은 이유를 적으십시오.
      inherited GIT_*는 제거한 뒤 owned aborting hook에서 관측한 비credential key whitelist를
      scratch identity/path 값으로 재구성하십시오. Git 2.52/macOS 관측 key는 AUTHOR_DATE,
      AUTHOR_EMAIL, AUTHOR_NAME, EDITOR, EXEC_PATH, INDEX_FILE, PREFIX이며 실제 변수 이름에는
      GIT_ 접두사가 붙습니다. 일반 commit 상대 index와 commit-a 절대 index를 구별하고 다른
      버전/플랫폼은 관측 또는 가설로 표시하십시오. default 관측에 없는 GIT_DIR/GIT_WORK_TREE를
      authentic 조건이라고 추가하지 마십시오. 상대 GIT_DIR 주입은 별도 artificial 회귀입니다.
      commit-a 전체 coverage는 owned parent scratch repo의 절대 GIT_INDEX_FILE을 bait로 쓰고
      main worktree live index는 사용하지 마십시오. parent index SHA-256은 실행 전후 동일해야
      합니다. focused negative는 unsanitized parent-marker, positive는 sanitize된 intended
      corpus/child를 증명하고 일반 상대 index 조건도 별도 확인하십시오. index 한 변수 fixture를
      전체 authentic 환경 proof로 부르지 마십시오. corpus Git consumer 전수 조사·caller/env
      표를 QA와 dispatcher가 읽고 기존 nonempty/identity/failclosed floor를 유지하십시오.
      전체 suite가 끝나면 fake HOME 생성물을 나열하고 문서화한 좁은 Bun cache 예외만 제외하십시오.
      /tmp/.claude-* 전후 차이는 suite-owned PID/external owner/unresolved로 귀속하십시오.
      unresolved 차이가 있으면 pollution 0 PASS를 선언하지 말고 조사·보고하십시오. 실제 HOME
      mtime으로 귀속하지 마십시오. 공유 marker를 proof용으로 만들거나 지우지 마십시오.
      센티널은 위험 cleanup namespace의 안전한 모의 tree에서 보존을 검증하고 무관한 scratch
      생존을 실제 broad cleanup 안전 증명으로 부르지 마십시오. 삭제 전 자기 경로 pgrep로
      프로세스 소유권을 확인·정리하고 정리 후 잔존 수를 기록하십시오. 예상 밖 실제 서버가
      시작되면 자기 PID와 관련 포트 해제까지 확인하십시오(#1823 H4, #1833 P1/P2).

      ## Commit hook diagnostics

      implement/release의 commit 발주자는 이 anchor와 Standard delegation-prompt block을
      mgr-gitnerd 완료 조건으로 전달하십시오. 실제 commit은 400000ms 이상 예산 또는 지속
      프로세스로 실행하고 stdout/stderr 전문을 고유 mktemp log에 직접 저장하십시오. pipe로
      rc를 숨기지 말고 실제 commit 종료 코드를 먼저 보존하십시오. 차단되면 retry 전에 실제
      HEAD·exit·실행 조건 및 아래 각 `(fail)`과 앞 40줄을 읽어 dispatcher에 보고하십시오.
      훅 밖 재실행 green을 intermittency 근거로 쓰지 마십시오. 자동 수정·restage 델타는
      검토하고 이전 evidence를 무효화할지 판정하십시오. no-verify로 우회하지 마십시오.
      아래는 이미 저장한 로그의 읽기 전용 진단이며 commit을 수행하는 코드가 아닙니다.

      # BEGIN commit-hook-diagnostics
      commit_log='<owned-raw-log-file>'
      commit_rc='<observed-exit-code>'
      [ -f "$commit_log" ] || exit 1
      printf 'commit_exit=%s\n' "$commit_rc"
      git rev-parse --verify HEAD || exit 1
      command awk '{ lines[NR] = $0; if (index($0, "(fail)")) { start = NR - 40; if (start < 1) start = 1; printf "failure_line=%d\n", NR; for (j = start; j <= NR; j++) printf "%d:%s\n", j, lines[j]; } }' "$commit_log" || exit 1
      # END commit-hook-diagnostics

      For Python/Go/Docker/static-site projects: auto-detect and run equivalent (py_compile + pytest / go build + go vet + go test / docker build / file validation).

      Halt conditions:
      - Lint errors (exit != 0)
      - Typecheck errors
      - NEW test failures (regression from baseline)
      - Coverage below the threshold `.husky/pre-commit` currently applies
      - Build failure
      - Lockfile drift
      - owned hook-like 환경·index hash 불변·corpus floor 또는 isolation 귀속 증거의 실패/누락

      Halt → report exact command + stderr + delta details. Do NOT proceed to release on any halt.
    description: "Auto-detected build + test verification (bun test with baseline delta guard)"
    depends_on: implement

  - name: deep-verify
    skill: deep-verify
    description: |
      Multi-angle release quality verification — self-review checklist if docs-only; mgr-sauron:watch single-goal delegation in every tier (docs-only, lite, standard) + core self-check if lite. mgr-sauron:watch 단일 목표 위임은 모든 티어에서 커밋 전, 따라서 첫 push 전에 1회 실행하며 재실행 금지 목록(이미 실측한 bun test·lint·typecheck·template-sync·wiki-sync·validate-docs·미러 md5)을 동봉합니다. 구조 표면이 없다는 것은 생략 사유가 아닙니다. 모든 릴리즈는 implement 단계의 필수 통합 커밋 순서를 따라 이 위임이 deep-verify 정정 뒤, 통합 커밋 앞에 오게 합니다(#1799 제안 1). MULTI-PHASE: 스킬을 그대로 spawn하지 말고 R020 「위임 경계를 Phase 개수로 설계」에 따라 단일 목표 위임으로 분할해 순차 발주하십시오 (#1595 #4). lite 분할 표준(#1652 #3-4): (1) mgr-sauron R017 구조 검증 단일 목표 위임 1건 + (2) 변경 성격별 적대적 리뷰 단일 목표 위임 1건 — 스크립트 변경이면 실행 재현 기반 adversarial-review, 룰/스킬/yaml 텍스트 변경이면 문구 정합·배선 리뷰. 훅·advisor 옵션 변경이면 합성 픽스처 외에 이 프로젝트 실 트랜스크립트 1건 계수 실측을 완료 조건에 포함(#1703 권장 2). 근거: v1.1.59/60 두 반복 연속 적대적 리뷰가 신규 회귀(M-3/M-4, heredoc 위조)를 실행 재현으로 포착. 검증 위임 표준 문안: 오케스트레이터가 이미 실측한 항목(bun test·lint·typecheck·template-sync·wiki-sync·validate-docs·미러 md5)은 위임서에 재실행 금지 목록으로 열거하고 재실측 대상만 지정하십시오 — v1.1.61 세션에서 금지 목록 없는 sauron 위임이 bun test를 재실행하다 25턴 절단됐고, 금지 목록을 명시한 재위임은 16 tool_uses로 완주했다(R020 maxTurns 절단 누적 7건째). 검증 위임도 편집 위임과 동일하게 턴 산술(대상 파일 수 × 판단 항목 수)을 계산해 위임서에 명시하고, 예산을 넘으면 파일군별로 분할해야 합니다 — v1.1.77 sauron 1차 위임은 30여 파일 + 판단 4항목을 단일 위임에 넣어 판정 없이 25턴에서 절단됐습니다(#1722 찐빠 #2). 리뷰어의 수정 제안과 「변이 X가 생존/포착된다」는 주장은 (a) 시험 런타임에서 도달할 수 있는지(예: Bun은 os.homedir()을 프로세스 시작 시 고정합니다), (b) 그 변이가 시험 환경에서 동치인지를 확인한 뒤에만 채택하며, 리뷰어 위임서에는 이 근거를 함께 적게 합니다. 문서·텍스트 제안은 도달성 검사 예외입니다. 가설 접수 원칙은 R020 「원인 분석도 완료 보고와 같은 등급의 검증 대상」(MUST-completion-verification.md)을 따릅니다(#1807 제안 2, #1811 찐빠 #3). 리뷰어 위임서도 implement 단계 Rules의 Standard delegation-prompt block을 지니며, 그 항목 중 「$HOME 아래 프로브·임시 파일 금지」가 리뷰어에게 적용됩니다(#1811 제안 4). Ordering: any wiki resync/manifest reseed for the changed rules/skills is dispatched after this step's findings are applied, not alongside it (#1688).

      ## Correction dispatcher

      deep-verify 발주자는 각 writer/QA/fresh reviewer의 실제 thread identity와 이 영역의
      이전 review 참여를 기록하십시오. 역할 이름만 바꿔 fresh라고 하지 마십시오. slot 교체나
      순차 새 thread가 가능한지 실제로 확인하고 불가하면 unmet을 보고하고 중단하십시오.
      Standard delegation-prompt block과 Implement evidence handoff를 모든 위임에 전달하십시오.
      dispatcher는 원 지적 전체와 원 설계 보장·입력 producer·새 하위 규칙·기존 지시/환경 접점
      표를 correction writer에게 전달하고 완료 보고에서 다시 읽으십시오. 표 누락이면 writer
      완료나 다음 리뷰 발주를 통과시키지 마십시오. 새 메커니즘 접점은 전수 검색 범위/한계와
      기존 지시 정합을 보고하십시오. reviewer는 보장·producer별 회귀 증거를 같은 표로 읽습니다.
      writer completion에는 실제 CI 잡 전체의 로컬 대응 결과를 넣으십시오(R023 floor).
      유효한 사전 결과는 재실행 금지 목록으로 전달하고, 새 메시지/export/config key는
      repository scan 등 전역 불변식 증거를 추가하십시오. targeted fixture만으로 완료하지
      마십시오. dispatcher가 source fingerprint/의존 입력을 비교해 변경으로 무효화한 항목만
      verify-build로 돌리고 실패·새 델타가 review도 무효화하는지 판정하십시오. clean 동일
      환경의 same-harness coverage 비교와 authentic bait proof는 구별하고 LCOV identity
      한계는 implement coverage clause대로 보고하십시오. 바뀐 상태에 옛 green을 쓰지 마십시오.
      정정 round는 최초 구현 리뷰를 제외하고 최대 3차입니다. 각 correction delta마다 그 영역의
      이전 리뷰에 참여하지 않은 fresh reviewer에게 독립 재리뷰를 발주하고 새 Medium+ 건수,
      기존 미해결 지적, writer/reviewer identity와 델타를 기록하십시오. 마지막 델타의 새
      Medium+ 0건과 현재 소스의 미해결 Medium+ 0건을 모두 확인해야 종료할 수 있습니다.
      3차에도 기존 또는 신규 Medium+가 남으면 release를 HALT하십시오. 비차단 이월 항목은
      한 후속 이슈로 통합하되 상한 도달을 현재 source 결함 waiver나 부분 해결 이슈의 전체
      close 근거로 사용하지 마십시오(#1830 P1/P2, #1833 P4/P6).
      예외는 Low만 남은 기계적 문구 치환이고 새 동작/메커니즘/측정 주장/보장 변화가 없을 때만
      허용하십시오. dispatcher는 해당 근거와 미러 cmp·예산·치환 계수·해당 설정 JSON 유효성을
      Tier 1로 읽고 닫을 수 있습니다. purported Low가 위 조건을 바꾸면 fresh review를 생략하지
      마십시오. 이 예외는 mandatory source Sauron/전역 불변식/actual precommit을 면제하지 않습니다.
      branch 체크는 첫 정정 수렴, 3차 잔여 Medium, 3차 새 Medium, strict Low-only, behavior를
      바꾼 Low 거부, 표 누락 HALT를 실제 발주·완료 기록에 대응하십시오. 산문 지시를 가짜
      executable state-machine 시험으로 실행 검증했다고 주장하지 마십시오.

      ## Source gate and wiki handoff

      정정·영향 재검증 뒤 mandatory source Sauron을 기존 모든 티어 순서로 발주하십시오.
      reviewed source 주장/인용·유효 deterministic 결과와 예정 wiki 경계를 입력으로 주고
      아직 생성되지 않은 wiki 완료 표를 요구하지 마십시오. 이후 wiki-curator에게 소스 직접
      문구/relative ref와 인용별 원문 검증·변경 주장 단위의 이전 표현 잔존 검색을 완료 조건으로
      위임하십시오. Early wiki result classification and handoff의 pending-documentation 표와
      raw log도 함께 전달하고 각 행의 정정·잔존 여부를 wiki-curator 완료 표에 대응하십시오.
      잔존 검색은 본문뿐 아니라 변경 로그·요약까지 포함하고 hit가 있으면 관련성
      판정 근거를 보고하십시오. 의역은 인용으로 표시하지 마십시오. wiki 페이지 수정이 끝난
      뒤 documented source-hash script로 wiki/.source-hashes.json만 reseed하십시오.

      ## Post-wiki deterministic verification

      wiki resync dispatcher는 wiki-curator 완료 표·실제 wiki artifact를 QA 검증 담당자에게
      전달하십시오. QA는 link/quote/residual/hash 결과를 직접 재계산하고 dispatcher가 그 PASS를
      읽어 mgr-gitnerd 통합 commit 전 조건에 전달하게 하십시오. QA는 조기 pending-documentation
      표의 모든 행이 해소됐는지와 실제 CI 전체 대응 결과의 현재 유효성을 함께 읽으십시오.
      미해결 행·표 누락·검사 실패는 commit/release를 HALT합니다. 유예를 최종 면제로 바꾸지 마십시오.
      deterministic link 진입점은 bash .github/scripts/verify-wiki-sync.sh이며 source hash PASS를
      link PASS로 바꾸어 부르지 마십시오. wiki-only 실패는 위키 정정·해당 결정론 검사로 돌아가고
      source 변경이 필요하면 Correction dispatcher의 invalidation branch로 돌아가십시오.
      동일 source의 full Sauron을 post-wiki라는 이유로 중복하지 마십시오. R017 Post-Gate
      Scope-Expansion Re-Run의 실제 변경 집합/조건은 그대로 적용하십시오. 최종 source delta와
      actual precommit 자동 수정도 유효성 확인 없이 기존 PASS를 재사용하지 마십시오.
    depends_on: verify-build

  - name: release
    prompt: |
      Create a GitHub Release.

      0a. User-execution constraint check (mandatory, before step 0, #1733 찐빠 #2): read
          CLAUDE.md, session memory, and the entry card (if the environment provides one, e.g. a
          recall entry card) for any user-execution constraint (e.g. "merge/tag/publish must be
          run by the user, not the agent"). For each command this release step is about to run:
          if it is COVERED by a constraint (merge, tag, publish), do NOT execute it — present the
          exact command(s) to the user and STOP this step; if it is NOT covered (e.g. branch
          creation, version bump, PR creation — coverage is judged by the scope of the constraint
          text actually found in CLAUDE.md/session memory, not by this example list), proceed
          normally. No matching constraint found → unchanged behavior, proceed to step 0. User decision
          (recorded): in an unattended run (`/fsd` etc. — see pre-triage Phase 0.6
          `unattended_mode`), STOP at the first covered command, present it to the user, and HOLD
          the convergence declaration until the user runs it and confirms.

      0. Pre-check (mandatory, delegate to mgr-gitnerd per R010): Detect and remove stale local `release` branch if present.
         The local `release` branch (file ref) conflicts with `release/v*` directory ref namespace.
         mgr-gitnerd executes (force-delete acceptable in automation context; warns if branch has unpushed commits):
           if git show-ref --verify --quiet refs/heads/release; then
             # Check for unpushed commits before force-delete
             if [ -n "$(git log refs/heads/release ^origin/develop --oneline 2>/dev/null)" ]; then
               echo "::warning::Local 'release' branch has unpushed commits — force-deleting anyway"
             fi
             git branch -D release
           fi
         Reference: issue #1141 (v0.135.0 follow-up), mgr-gitnerd MEMORY.md.

      1. Version bump (mandatory):
         Orchestrator delegates to mgr-updater (R010) for the file edits below; mgr-gitnerd (R010) for branch/commit/push.
         Determine NEW version per semver rules below FIRST — before touching any file.

         ⚠ Branch-before-bump (#1542, observed v1.1.38): for npm project with auto-tag.yml (this repo), the
         version-bump commit MUST be created ON release/v{NEW}, and MUST NOT be pushed to develop directly.
         Pushing the bump commit to develop before branching leaves develop and release/v{NEW} pointing at the
         SAME commit → PR diff=0 → `gh pr create` fails with "GraphQL: No commits between develop and
         release/v{NEW}". Evidence: PR #1538 (v1.1.37) and PR #1534 (v1.1.36) each contain exactly ONE commit
         (the bump commit) — proof the bump belongs on the release branch, never on develop directly.

         npm project (package.json exists):
           a. mgr-gitnerd: git checkout develop && git pull origin develop
              (R017 Pre-Branch Freshness Gate — ensures local develop holds every merged feature commit before branching)
           b. mgr-gitnerd creates release/v{NEW} branch from develop and checks it out — BEFORE any edit in c–i below.
              (This is the step that used to run AFTER the bump in step 3.a of the old ordering — moving it here
              is the #1542 fix. Do NOT perform steps c–i on develop.)
           c. package.json: jq '.version = "<NEW>"' package.json > package.json.tmp && mv package.json.tmp package.json   [on release/v{NEW}]
           # ⚠ jq '.version=...' PRESERVES the manifest structure {version, lastUpdated, omcustomMinClaudeCode, components[]}.
           #   Edit ONLY the .version field — do NOT overwrite templates/manifest.json wholesale (e.g. a source-hash path→hash map).
           #   Recover a corrupted manifest: git show HEAD:templates/manifest.json | jq '.version="<NEW>"' > templates/manifest.json (#1423/#1154).
           d. templates/manifest.json: jq '.version = "<NEW>"' templates/manifest.json > templates/manifest.json.tmp && mv templates/manifest.json.tmp templates/manifest.json   [on release/v{NEW}]
           e. ⚠ PREREQUISITE: steps c (package.json) AND d (templates/manifest.json) MUST BOTH be completed
              before running this step. bun run build — run standalone (NO pipe), read exit code directly
              ($? after a pipe is the last command's, R005/#1492).
              Actual mechanism (corrected, #1593): `bun run build` invokes `scripts/sync-source-lockfile.ts`
              (a 10-line wrapper with no version literals of its own), which calls
              `generateAndWriteLockfileForDir` (`src/core/lockfile.ts`). That function reads versions via
              `loadVersions()` (`src/core/sync.ts`) — `generatorVersion` FROM package.json, `templateVersion`
              FROM templates/manifest.json — and writes both into .omcustom.lock.json. If step d has not yet
              landed when this runs, the lockfile silently records the PREVIOUS templateVersion — no warning,
              no error. Observed contamination: v1.1.47 shipped generatorVersion=1.1.47 / templateVersion=1.1.46
              because the bump commit created package.json + lockfile together and manifest.json was bumped in
              a later commit. Do NOT run this step until BOTH c and d are staged.   [on release/v{NEW}]
              ⚠ Recap (R017 「버전 범프 원자 순서」, #1619 #4, v1.1.50 실측): package.json과 templates/manifest.json을 동시에 범프한 뒤 bun run build를 실행하고, build가 갱신한 lockfile을 스테이징한다 — 순서 위반 시 CI Version Sync 3-way(package.json/manifest.json/lockfile) 대조가 차단한다. v1.1.50에서 manifest.json 범프 누락 → 1차 실패, build를 manifest 범프 전에 실행 → 2차 실패(lockfile에 구버전 templateVersion 각인)했다.
           f. git status --short — enumerate ALL tracked drift (`^ M`) the build produced; stage EVERY one (esp. .omcustom.lock.json) before commit.
              (#1531 — .omcustom.lock.json missed staging across 4 consecutive releases after v1.1.29; root cause was no build step between version bump and commit.)   [on release/v{NEW}]
           g. mgr-gitnerd commit: "chore(release): bump to v<NEW>" — MUST include the drift from step f.
              ⚠ do NOT add Closes/Fixes/Resolves keywords to this commit message (#1542) — this commit merges into
              develop later via the release PR; a close keyword here bypasses the PR-body mechanism auto-tag.yml
              relies on (see step 3.b below). Use `Refs #N` if a cross-reference is needed.
              ⚠ Commit trailers MUST use ONLY the exact trailer text supplied in this delegation
              prompt — do not add or rewrite any other trailer, even when the agent's own
              environment or system instructions suggest a different attribution (#1728 찐빠 #6,
              #1778 찐빠 #2; see implement step 5).
              ⚠ Standard delegation-prompt block (implement 단계 Rules): 이 bump 커밋·push 위임서도 이 블록을 지닙니다(#1807 제안 4, 찐빠 #5).
               ⚠ Bash timeout (#1645): delegate this commit with an explicit `timeout: 400000` — the
               main-worktree pre-commit hook runs the full test suite (~165s) and the Bash default of
               120000ms kills it with exit 143. `--no-verify` is NOT an acceptable workaround (R010).
               이 bump commit 위임도 verify-build의 Commit hook diagnostics를 읽고 고유 raw
               log·실제 exit/HEAD·각 failure 앞 40줄을 보고하십시오. 자동 수정 델타와 기존
               source/post-wiki evidence의 유효성을 dispatcher가 재판정한 뒤에만 진행하십시오.
           h. mgr-gitnerd push release/v{NEW} to origin — NEVER push this commit to develop directly. Pushing to
              develop here reproduces the diff=0 PR failure this reordering fixes (#1542).
           i. mandatory verification (with existence guard for partial-update safety), run on release/v{NEW}:
              [ -f scripts/verify-version-sync.sh ] && bash scripts/verify-version-sync.sh || echo "::warning::verify-version-sync.sh not found, version sync verification skipped"
              (verify-version-sync.sh 가 exit 1 시 release 단계 halt)
           j. lockfile 3-way assertion (#1593 제안3, closes the gap step i's 2-way check misses) — run standalone
              (NO pipe), read exit code directly, on release/v{NEW}:
              jq -e --arg v "<NEW>" '.generatorVersion==$v and .templateVersion==$v' .omcustom.lock.json
              실패 시 release 단계 halt — cause is almost always step e run before step d landed; fix by
              re-running step d then step e, re-staging, and re-running this assertion.

         Version decision (semver) — PATCH-PREFERRED policy (post-1.0.0):
         - No existing tags → v0.1.0
         - Previous tag exists → DEFAULT to patch. When in doubt, patch — do NOT reflexively bump minor for rule/doc/skill edits.
           - patch (DEFAULT): rule/doc/skill/config/wiki/workflow changes, bugfixes, hardening, CC-compat notes — the vast majority of this project's changes
           - minor: ONLY a new user-facing capability that changes HOW the harness is used — a new
             workflow axis, a new command surface users must learn, or a contract other components
             depend on. NOT "a file was added under .claude/skills/ or .claude/agents/".
             ⚠ Counter-example (Origin: v1.1.49 세션, 사용자 지적): adding one skill + one agent
             (agora: skills 114→115, agents 49→50) was initially scoped as v1.2.0 minor by reading
             the old wording literally. That was WRONG — this repo adds skills routinely, and
             skills reached 115 while the version stayed v1.1.48, so skill/agent addition is
             ESTABLISHED as patch (target was corrected to v1.1.49). Count growth is this repo's
             baseline rate of change, NOT a minor signal. If a version bump would follow
             mechanically from "a new file exists", it is patch. Ask instead: does a user's
             workflow change because of this?
           - major: breaking changes to user-facing contracts (CLI flags, public skill/command names, public API), or a deliberate milestone declaration (e.g., v1.0.0)
         - Previous tag is ahead of source version (e.g., tag v0.136.1, package.json 0.136.0): use next available skip-version (0.136.2)

      2. Release notes via omcustom-release-notes skill
      3. Adapt release mechanism to project (determines how steps 3-5 execute):
         - Milestone assignment gate (all projects; run BEFORE any PR is created or tag is pushed below): confirm that milestone
           vX.Y.Z exists and is open, and that EVERY issue of this release's scope is assigned to it. The scope includes issues
           admitted mid-run by scope-selection rule 7 (Plan-stage admission), not only the issues listed at selection time.
           `--paginate` is REQUIRED on the milestone query for the same reason as in scope-selection Step 0 (a single page of a
           repository with 100+ milestones can drop the newest entry). Write the script below to a file with the Write tool,
           substituting `vX.Y.Z` and the literal issue list (`<N1> <N2> ...`) once each, and run it as ONE Bash call, reading the exit code directly (no pipe):
             ms=$(gh api 'repos/{owner}/{repo}/milestones?state=all&per_page=100' --paginate --jq '.[] | select(.title == "vX.Y.Z" and .state == "open") | .number') || { echo "FAIL: milestone query failed"; exit 1; }
             if [ -z "$ms" ]; then echo "FAIL: milestone vX.Y.Z is absent or not open"; exit 1; fi
             fail=0
             for n in <N1> <N2>; do
               have=$(gh api "repos/{owner}/{repo}/issues/$n" --jq '.milestone.number // "none"') || { echo "FAIL: issue lookup failed for #$n"; fail=1; continue; }
               [ "$have" = "$ms" ] || { echo "FAIL: #$n is not assigned to milestone vX.Y.Z (assigned: $have)"; fail=1; }
             done
             if [ "$fail" -ne 0 ]; then echo "FAIL: milestone assignment gate"; exit 1; fi
             echo "PASS: milestone vX.Y.Z is open and every scope issue is assigned"
           A FAIL line (non-zero exit) blocks PR creation. The correction is to re-run scope-selection Step 0 and the
           'Assign scoped issues to milestone' procedure at the end of scope-selection Step 3, then re-run this gate until it prints PASS.
           Do not open the PR or push the tag on an unverified milestone.
         - npm project with auto-tag.yml (this repo — release/v* PR pattern):
           a. release/v{NEW} branch + version-bump commit were already created in step 1.b–1.h above — do NOT
              re-create the branch or re-run the bump here; this step only opens the PR against the existing branch.
           b. mgr-gitnerd creates PR: gh pr create --base develop --head release/v{NEW} --title "chore(release): bump to v{NEW}" --body-file <pr-body-file>
              The PR body is a file channel, never an inline argument: in the same delegation, mgr-gitnerd writes the body with the Write tool to a unique git-ignored path (for example `.claude/outputs/sessions/{YYYY-MM-DD}/pr-body-v{NEW}.md`, which `.gitignore` covers through `.claude/*`) and passes only that path to `gh pr create … --body-file <pr-body-file>`. The body MUST include 'Closes #N' for EVERY issue this release resolves. Issue-derived text inside an inline `--body "…"` would be evaluated by the shell (`$(…)`, backticks) before gh runs (#1831 F9).
              ⚠ auto-tag.yml closes issues by grep'ing Closes/Fixes/Resolves keywords in the PR BODY — NOT by milestone membership NOR by commit message trailers. If the keywords are missing, no issues close and the workflow still reports success (#1531). Commit-message close keywords are explicitly forbidden during `implement` and step 1.g above (#1542) — the PR body is the ONLY place a close keyword should appear.
              Before creating the PR, confirm the body file actually contains a Closes line per issue: run the quote-verify block (defined in the implement step's fixed constraint (c)) with the quotations being one `Closes #<N>` line per issue (written to a file with the Write tool) and the target being the PR body file. A count of 0 for any line blocks PR creation.
           c. mgr-gitnerd merges PR: gh pr merge {n} --merge --delete-branch (plain merge — NOT --admin).
              Ground-truth (measured 2026-08-15, `gh api repos/{owner}/{repo}/branches/develop/protection`):
              required status checks are exactly 6 — Test, Lint, Template Sync, Version Sync,
              Dependency Security Audit, Rust Tests (strict=true); enforce_admins=false; NO
              required_pull_request_reviews (no reviewer-approval requirement exists). v1.1.47 merged with a
              plain `gh pr merge 1585 --merge --delete-branch` — no --admin needed. A plain merge succeeds
              once all 6 checks report green. If the merge is rejected, do NOT reflexively add --admin —
              re-run the protection query above to re-measure current requirements and report the actual
              blocker (R010 bypass-flag pre-check: name what is bypassed and why before ever using --admin).
           d. DO NOT manually git tag or gh release create.
              auto-tag.yml fires on release/v* PR merge → creates tag → closes issues linked via PR-body Closes/Fixes/Resolves keywords → closes milestone → deletes release branch.
              release.yml fires on the tag → npm publish + GitHub Release creation.
           Milestone close and issue close are handled downstream by auto-tag.yml — do NOT close them manually.
           After merge, verify each targeted issue is actually CLOSED (gh issue view); close manually if still open. Workflow conclusion=success is not evidence of close (#1531 — v1.1.34 Closes-keyword omission left 5 issues open, manual close required).
         - Non-npm / no auto-tag.yml:
           mgr-gitnerd: git tag v{NEW} && git push origin v{NEW}
           mgr-gitnerd: gh release create v{NEW} --notes-file <release-notes-file>
           The notes file follows the omcustom-release-notes convention: written with the Write tool to a git-ignored notes file (for example `.claude/outputs/sessions/{date}/release-notes-{VERSION}.md`), never inlined in the command line. The tracked root `release_notes.md` is not used as the `--notes-file` input.
           Then proceed with items 4-5 below.

      4. Close milestone (non-auto-tag projects only — auto-tag.yml handles this for npm+PR projects):
         gh api repos/{owner}/{repo}/milestones/{n} --method PATCH --field state=closed

      5. Close verify-ready issues (non-auto-tag projects only — auto-tag.yml handles this for npm+PR projects):
         gh issue close {n} --comment "Fixed in v{version}"
         Label needs-review issues as "Deferred from v{version}"

      6. npm publish verification (npm projects only):
         After auto-tag.yml + release.yml complete (verified in ci-check step):
         npm view <pkg> version → must equal v{NEW}
    description: "Git tag + GitHub Release + close milestone/issues (with mandatory version sync verification)"
    depends_on: deep-verify

  - name: ci-check
    prompt: |
      Post-release CI verification.

      1. Check if .github/workflows/ has CI workflows
         If NOT: skip with "No CI configured. Skipping." and continue.
      2. If CI exists:
         - gh run list --limit 10
         - Wait for runs triggered by the new tag/push — poll WITHIN the Bash timeout budget
           (loop_count × sleep_interval + command time ≤ timeout, with margin), or prefer a
           single bounded call `gh run watch <run-id> --exit-status` (optionally
           run_in_background) over an unbounded manual poll loop (#1711 찐빠 #6).
         - Any wait/poll loop in this step, including a release-publish package-availability
           wait, MUST print one progress line per iteration (attempt count, current observed
           value) so a long-but-normal wait is not mistaken for a stall — a single bounded
           `gh run watch`/`gh pr checks --watch` call already streams periodic status, which
           serves the same anti-stall purpose and satisfies this requirement without extra
           instrumentation (#1752 찐빠 #2).
         - When confirming a behavior from a workflow log by grepping a string (for example the
           duplicate-test-skip notice of release.yml), restrict the match to the OUTPUT prefix so
           the script source line does not match: grep `##[notice]tree`, not the bare phrase (the
           script source line `echo "::notice::tree …"` also contains the phrase) and not
           `##[notice]` alone (other notice lines, such as the CHANGELOG deprecation notice, match
           it too). Example form — `gh run view <run-id> --log | command grep -F '##[notice]tree'`
           (#1807 찐빠 #7, 하네스 제안 P5).
         - If failures: diagnose, fix, re-verify
      3. For npm projects with auto-tag.yml: MANDATORY additional check:
         gh run list --workflow auto-tag.yml --limit 1 --json conclusion,displayTitle
         ⚠ auto-tag.yml run의 `headSha`는 **release 브랜치 head(PR head SHA)**이지 머지 커밋이 아니다 — 폴링 종료
         조건을 머지 커밋 SHA로 걸면 영원히 미일치해 타임아웃까지 전량 소진한다(v1.1.61 세션 실측: 40회/10분 전량
         소진, v1.1.62에서 PR head로 정정 → 22회 정상 종료). release.yml run은 `displayTitle`에 PR 번호/브랜치명이
         들어가므로 그것으로 식별한다.
         → conclusion MUST be "success" before declaring release complete.
         If auto-tag.yml concluded "failure": diagnose root cause. Do NOT retry with manual git tag.
         Common causes:
           - Tag already exists (manual tag pushed before PR merge — fix: remove manual tag from release delegation)
           - Branch naming mismatch (branch not matching release/v* pattern — fix: verify branch name)
         Report: "[ci-check] auto-tag.yml: {conclusion}" as mandatory line in CI status report.
      4. For npm projects: verify npm publish succeeded (npm view <pkg> version)
      5. Verify every scoped issue's label/state lifecycle landed: `in-progress` removed and
         the issue CLOSED for each issue that was in this release's scope — do not rely on the
         implement step having run the lifecycle transition; check directly with
         `gh issue view <N> --json state,labels` (#1722 찐빠 #6, closes gap where CLOSED issues
         retained `in-progress`). This step finds AND fixes, not verify-only: if a stale
         `in-progress` label remains, remove it (`gh issue edit <N> --remove-label
         in-progress`) and report the fix; if the issue is still OPEN, do NOT close it here —
         closing stays with auto-tag.yml unless it failed to close that issue, in which case
         report the open issue for manual close per release step 3.d above (#1722 하네스 제안
         4). Additionally, for each scoped issue that IS closed by THIS release, remove a
         lingering `verify-ready` label if present (`gh issue edit <N> --remove-label
         verify-ready`) — scoped to THIS release's closed issues only; bulk-removing
         `verify-ready` from previously closed issues is explicitly excluded (user decision,
         #1734).
      6. Report final CI status. For a release that claims a speed improvement (CI or test
         duration), the report MUST include the measurement, not a single total wall-clock
         figure: per-file wall-clock times computed from the log `##[group]` timestamps, compared
         with unchanged files as a control group, with any difference attributed to execution
         order (runner variance of ±20% or more was observed [이슈 서술], #1803 제안 3). This is the
         measured report that answers the deep-plan step's measurement requirement; a release that
         makes no speed claim is exempt.
    description: "Post-release CI verification and fix loop"
    depends_on: release

  - name: post-release-followup
    skill: post-release-followup
    description: "Register follow-ups from this release as new issues"
    depends_on: ci-check
