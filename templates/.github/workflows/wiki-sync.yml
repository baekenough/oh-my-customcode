name: Wiki Sync

on:
  push:
    branches:
      - develop
    paths:
      - '.claude/agents/**'
      - '.claude/skills/**'
      - '.claude/rules/**'
      - 'guides/**'
      - 'wiki/**'
      - 'scripts/verify-wiki-links.ts'
      - 'tsconfig.wiki-links.json'
      - 'tsconfig.json'
      - 'tests/unit/scripts/verify-wiki-links.test.ts'
      - '.github/scripts/verify-wiki-sync.sh'
      - '.github/scripts/lib/source-hash.sh'
      - '.github/workflows/wiki-sync.yml'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    branches:
      - develop
    paths:
      - '.claude/agents/**'
      - '.claude/skills/**'
      - '.claude/rules/**'
      - 'guides/**'
      - 'wiki/**'
      - 'scripts/verify-wiki-links.ts'
      - 'tsconfig.wiki-links.json'
      - 'tsconfig.json'
      - 'tests/unit/scripts/verify-wiki-links.test.ts'
      - '.github/scripts/verify-wiki-sync.sh'
      - '.github/scripts/lib/source-hash.sh'
      - '.github/workflows/wiki-sync.yml'
      - 'package.json'
      - 'bun.lock'

concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wiki-staleness-check:
    name: Wiki Staleness Check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install verification dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify wiki pages, counts, source hashes, and links
        run: bash .github/scripts/verify-wiki-sync.sh
