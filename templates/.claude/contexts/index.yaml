# Claude Code Contexts Configuration
# Source: https://github.com/affaan-m/everything-claude-code

contexts:
  dev:
    file: dev.md
    mode: Active development
    focus: Implementation, coding, building features
    priority: Working > Correct > Clean

  review:
    file: review.md
    mode: PR review and code analysis
    focus: Quality, security, maintainability
    checklist:
      - Logic correctness
      - Error handling
      - Security
      - Performance
      - Readability
      - Test coverage

  research:
    file: research.md
    mode: Exploration and investigation
    focus: Understanding before acting
    process:
      - Understand question
      - Explore code/docs
      - Form hypotheses
      - Validate with evidence
      - Summarize findings

  delegation:
    file: delegation.md
    mode: Delegation-prompt authoring (L2 event pack)
    focus: Measured facts in prompts, approval/privilege boundaries, parallel disclosure, spawn announce format
    injected: PreToolUse on Agent, Task, SendMessage (once per session and agent, by context-pack-injector.sh)

  commit-release:
    file: commit-release.md
    mode: Commit, push, PR and release time (L2 event pack)
    focus: Git delegation gates, release staging and version bump, CI/publish ground truth
    injected: PreToolUse on Bash running git commit/push, gh pr create/merge, gh release, npm publish (once per session and agent, by context-pack-injector.sh)

usage:
  description: |
    Use contexts to change Claude's behavior mode.
    Include the context file content in your prompt or
    reference it at the start of a session.
  example: |
    "Using review context, analyze this PR..."
    "In dev mode, implement this feature..."
