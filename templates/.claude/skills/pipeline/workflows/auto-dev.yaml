name: auto-dev
description: "Automated development pipeline — from issue triage to release"
version: "2.1.0"

# Design rule: each pipeline run produces ONE bounded release unit (3-7 issues), not all open issues.
# This pipeline is a project-agnostic template. Project-specific overrides belong in
# the project's own workflows/auto-dev.yaml (e.g., AgentNav, second-brain).
#
# Design rule (R020 「위임 경계를 Phase 개수로 설계」 배선, Origin: #1595 #4):
# 아래 `skill:` 스텝 중 다중 Phase 스킬(deep-plan = research→plan→verify, deep-verify = 다각 검증)은
# 스킬을 그대로 spawn하지 않는다. Phase 경계가 곧 종료 유혹 지점이므로, 발주 전에 스킬의 Phase를
# 읽고 **단일 목표 1개짜리 위임**으로 분할해 순차 발주한다. 실측(v1.1.48): `skill: deep-plan`을
# 그대로 호출한 결과 tool_uses=0 / 6.9초 / 산출물 0으로 종료했고, 단일 목표 Plan 에이전트로
# 재설계하니 1/1 완주했다. `skill:` 값은 **분할의 근거가 되는 스킬 정의**를 가리키는 것이지
# "이 스킬을 1회 호출하라"는 뜻이 아니다.

steps:
  - name: pre-triage
    prompt: |
      Phase 0 — Sync local with remote.

      1. Fetch all remote state:
         git fetch --all --tags --prune

      2. Detect behind count vs origin/HEAD branch:
         current_branch=$(git rev-parse --abbrev-ref HEAD)
         behind=$(git rev-list --count HEAD..origin/$current_branch)

      3. If behind > 0:
         - Working tree clean (git status --short empty):
           git pull --ff-only
           report: "[pre-triage] synced $behind commits"
         - Working tree dirty:
           HALT with "[pre-triage] $behind commits behind, working tree dirty — manual reconcile required"
           exit 1

      4. Report current state:
         - Latest tag: git tag --sort=-v:refname | head -1
         - Local HEAD: git rev-parse --short HEAD
         - Behind state: synced or 0

      5. Cross-reference checks (advisory, do NOT halt):
         a. Memory vs git consistency (G7):
            - latest_tag=$(git tag --sort=-v:refname | head -1)
            - Compare with "Last release" or equivalent line in pipeline memory/context
            - If mismatch: stderr warning "[pre-triage] WARNING: memory says vX.Y.Z but git latest tag is vA.B.C — update memory after pipeline completion"
            - Do NOT halt (advisory only — memory updates are session-end responsibility)

         b. Issue body stale version references (G5):
            - Retrieve open issues: gh issue list --state open --limit 100 --json number,body
            - For each issue body, extract all vX.Y.Z patterns (regex: v\d+\.\d+\.\d+)
            - Retrieve git tag list: git tag --list
            - Flag any issue referencing a version not present in git tags:
              "[pre-triage] WARNING: Issue #N references vX.Y.Z (not in git tags) — body may be stale"
            - Output all warnings as advisory log; do NOT halt

      Phase 0.5 — Measure the EFFECTIVE permission mode (advisory, do NOT halt).

      Why: CC v2.1.257 stopped honoring `permissions.defaultMode` declared in PROJECT scope
      (`.claude/settings.json` / `.claude/settings.local.json`). Only user/managed scope or an
      explicit `--permission-mode` flag takes effect. R010 「Universal bypassPermissions」 assumes
      the parent session runs unattended under bypassPermissions; if that assumption is silently
      false, this pipeline stalls on a permission prompt mid-run with no diagnostic (#1644).

      1. Read the user-scope setting (project scope is NOT authoritative on v2.1.257+):
         user_mode=$(jq -r '.permissions.defaultMode // "unset"' ~/.claude/settings.json 2>/dev/null || echo "unset")

      2. The `--permission-mode` launch flag cannot be read from inside the session. Treat it as
         UNKNOWN — never infer that it was passed.

      3. Report and, when not bypassPermissions, warn:
         - user_mode == "bypassPermissions":
           report: "[pre-triage] effective permission mode: bypassPermissions (user scope)"
         - otherwise:
           stderr warning: "[pre-triage] WARNING: effective permission mode is <user_mode>; unattended run may prompt. Project-scope permissions.defaultMode is IGNORED on CC v2.1.257+ (#1644). To run unattended, launch with --permission-mode bypassPermissions or set it in user-scope ~/.claude/settings.json."
         - Do NOT halt (advisory only — a prompted run still completes with a human present).

      4. Do NOT read, echo, or modify any credential material while checking settings — read the
         single `permissions.defaultMode` field only (R001).

      Phase 0.6 — Detect unattended mode deterministically (#1650 C).

      Why: scope-selection Step 3 defers `.claude/hooks/**` issues in unattended runs. Until v1.1.60 the
      signal was prose ("entered via /fsd or the session says autonomous"), which is not measurable.
      `/fsd` now writes a marker at entry (fsd SKILL.md 「무인 모드 마커」) and removes it at convergence.

      1. Measure (both signals; either one is sufficient):
         marker="/tmp/.claude-fsd-$PPID"; unattended_mode=false; marker_state=absent
         if [ -f "$marker" ]; then
           if [ -n "$(command find "$marker" -mmin +360 2>/dev/null)" ]; then marker_state=stale; else marker_state=present; fi
         fi
         if [ "$marker_state" = "present" ] || [ "${OMCUSTOM_UNATTENDED:-}" = "1" ]; then unattended_mode=true; fi
         echo "unattended_mode=$unattended_mode marker=$marker_state env=${OMCUSTOM_UNATTENDED:-unset}"
         `$PPID` inside the Bash tool is the Claude Code process and is stable across calls, so the
         marker written by `/fsd` in an earlier call is visible here.
         A marker older than 360 minutes is treated as absent (stale guard — crash / PID reuse); `/fsd`
         re-writes the marker at every iteration start. The snippet always exits 0 so a false result is
         not mistaken for a measurement failure.

      2. Report: "[pre-triage] unattended_mode=<true|false> (marker /tmp/.claude-fsd-$PPID: <present|stale|absent>; OMCUSTOM_UNATTENDED=<value|unset>)"

      3. Output `unattended_mode` as pipeline state for scope-selection Step 3. Do NOT infer unattended
         mode from prose or from the fact that this pipeline was invoked by a skill — only the two
         measured signals above count.

      Phase 1 — Ensure required labels exist, then scan issues.

      1. Create labels if missing (idempotent):
         gh label create in-progress --color "FBCA04" --description "Work in progress" --force 2>/dev/null
         gh label create verify-ready --color "0E8A16" --description "Ready for verification" --force 2>/dev/null
         gh label create needs-review --color "D93F0B" --description "Needs manual review" --force 2>/dev/null
         Run these three commands literally as written — do NOT rewrite them as a shell loop (zsh does not word-split an unquoted `$var`, which can silently create malformed label names, #1743 찐빠 #1).

      2. Scan open GitHub issues:
         gh issue list --state open --limit 100 --json number,title,labels,body,milestone

      3. Group by label and compute for each issue:
         - dependencies: parse "see #N", "depends on #N", "#N 참조" from body
         - blocked_by_decision: true if body references any decision-needed issue
         - effort: XS/S/M/L from scope
         - order: topological sort over dependencies

      4. Output: dependency-sorted issue table with blocked_by_decision flag.
    description: "Sync remote, stale-version check, memory consistency check, scan issues"

  - name: scope-selection
    prompt: |
      Select a single bounded release scope (3-7 issues) for THIS pipeline run.

      ## Step 0 — Milestone state pre-check (G3)

      Before creating a milestone for version vX.Y.Z:
      1. Query all milestones (open and closed):
         existing=$(gh api 'repos/{owner}/{repo}/milestones?state=all&per_page=100' --jq '.[] | select(.title == "vX.Y.Z") | "\(.number)|\(.state)"')
      2. Evaluate:
         - If existing && state=closed:
           HALT with "[scope-selection] BLOCKED: milestone vX.Y.Z already exists and is closed. Bump version or reopen milestone manually."
         - If existing && state=open:
           Use existing milestone as-is (do not create new)
         - If not existing:
           Create new milestone: gh api repos/{owner}/{repo}/milestones --method POST --field title="vX.Y.Z"

      ⚠ This step is a 3-BRANCH STATE MACHINE (closed → HALT / open → reuse / absent → CREATE),
        NOT a gate-only pre-check. The "absent → create" branch is a STATE CHANGE and is therefore
        NEVER skipped by compression (see "Cross-tier — State-Change Side Effects Are NEVER
        Compressed" in compression-mode-eval). Reading this as "just a milestone existence gate"
        and skipping it under lite/docs-only leaves the release with no milestone (#1553 찐빠 #3).

      3. Post-condition — MANDATORY re-query before proceeding:
         gh api 'repos/{owner}/{repo}/milestones?state=all&per_page=100' --paginate \
           --jq '.[] | select(.title == "vX.Y.Z") | "\(.number)|\(.state)"'
         The milestone MUST exist and be open. If the re-query returns nothing, the create branch
         did not take effect — HALT; do NOT proceed to Step 1 on an unverified milestone.
         `--paginate` is REQUIRED: with 100+ milestones in the repo a single page silently drops
         the newest entries, so a just-created milestone can read back as absent.

      ## Step 1 — Label-based filtering (G4)

      Reference label semantics: .claude/skills/pipeline/labels.md

      Apply filter rules:
      - EXCLUDE: blocked_by_decision == true OR labels ∩ {decision-needed, needs-review, triage-complete, manual-action, in-progress} ≠ ∅
      - INCLUDE (preferred): labels ∩ {verify-ready, claude-code-release, documentation} ≠ ∅
      - INCLUDE (standard): P1/P2/P3 issues not in excluded set
      - Tie-break: P1 > P2 > P3 > unclassified

      ## Step 2 — Selection rules

      1. Determine release tier:
         - No tags yet → v0.1.0
         - Otherwise: highest-priority open tier (bug → chore → feature)
      2. Apply Step 1 filter (label-based exclusion and preference)
      3. Sort by dependency: prerequisites before dependents
      4. Cap at 7 issues; if priority issues < 7, stop at that priority (don't mix tiers)
      5. Minimum 1 issue; if 0 eligible, halt with "no eligible issues for auto-dev run"

      ## Step 3 — Approval-required path pre-check (R010)

      For each scoped issue, extract target file/directory paths from its title+body (explicit
      paths, backtick-quoted paths, or clearly named targets).

      Measure each extracted path with `git ls-files` NOW, before scope is committed — do not
      defer this to implement time — but ONLY for a target the issue treats as an EXISTING
      file (edit/refactor of a path the issue claims already exists). If such a path is absent
      from this repo (e.g. it belongs to a different repository), route that issue to
      decision-needed or exclude it from this scope immediately (scope-selection 단계에서
      이슈가 가리키는 경로의 `git ls-files` 실측을 선행, #1725 찐빠 #4). For a target the issue
      is CREATING (a new file), this absence check does not apply — a new file is by
      definition untracked (R010 「Required Checks」: 신규 생성 대상은 path-existence 확인에서
      제외); instead confirm the parent directory exists, and do NOT exclude the issue solely
      because the new file path itself is absent.

      Check against `.claude/rules/MUST-orchestrator-coordination.md` "Protected Paths":
      - `.claude/hooks/**` → EXCLUDED from mgr-creator routing; requires EXPLICIT USER APPROVAL
        (security-critical). If any scoped issue targets this path, request approval for the
        FULL scoped set NOW, before proceeding — do not let a later step (e.g. compression-mode-
        eval) discover it mid-run after scope is already committed (#1574 찐빠 #5).
      - `.claude/agents/*.md`, `.claude/skills/*/SKILL.md`, `guides/*/` (new dirs) → route to
        mgr-creator at implement time (delegation requirement, not a HALT).

      If approval was already granted THIS session for the same category+target, do not
      re-request (R015 directive persistence).

      무인 실행(`/fsd` 등 사용자가 실시간 응답할 수 없는 루프)에서는 `.claude/hooks/**` 대상 이슈를
      이번 스코프에서 **분리·이월**하고 나머지 적격 이슈로 진행하며, 반복 경계(homework 게이트)에서
      승인 질문을 **1회** 묶어 제시한다. 승인을 받으면 R015 directive persistence로 세션 내 동일
      카테고리에 지속 적용. 유인 모드에서는 기존대로 즉시 승인 요청. 무인 판별은 pre-triage Phase 0.6이 실측한
      `unattended_mode` 상태를 사용한다(마커
      `/tmp/.claude-fsd-$PPID` 또는 env `OMCUSTOM_UNATTENDED=1`; #1650 C). 산문 추론("/fsd로 진입한 것
      같다")으로 무인 여부를 판정하지 않는다.

      Output approval_required_paths (list, empty if none) as pipeline state.

      Assign scoped issues to milestone.
      Output markdown release manifest:
        | order | # | title | prerequisite | effort | labels |

      Persist manifest as pipeline state for subsequent steps.
    description: "Milestone state pre-check, label filter, pick 3-7 issues as v{X.Y.Z} scope, R010 approval-required path pre-check"
    depends_on: pre-triage

  - name: compression-mode-eval
    prompt: |
      Evaluate the pipeline compression mode (G6). Three tiers exist:
      docs-only (heaviest compression) → lite (intermediate) → standard (no compression).

      ## Reference

      .claude/skills/pipeline/labels.md — "Compression Eligibility" section

      ## Tier 1 — docs-only

      Conditions (BOTH must hold):
      1. scope size ≤ 3 (number of issues in release manifest)
      2. ALL scoped issues have labels ∩ {documentation, automated, claude-code-release, enhancement-yaml-only} ≠ ∅

      If met → set compression_mode=docs-only
        - triage step: skip professor-triage skill; perform direct manifest summary instead
        - plan step: skip release-plan skill; single-response plan instead
        - deep-plan step: skip deep-plan skill; single-response implementation notes instead
          (except when scope contains a security/availability issue — see the Cross-tier
          「Lightweight Skill-Mode Substitution」 restriction below, which forbids this
          substitution for such issues)
        - deep-verify step: skip deep-verify skill; perform self-review checklist instead
          — 단, 변경 집합에 `.claude/rules/**`(또는 agents/skills frontmatter 등 구조 표면)가
          포함되면 self-review로 대체하지 않고 mgr-sauron R017 검증을 **단일 목표 위임으로 필수
          실행**한다(Tier 2 lite의 R017 조항과 동일 원칙; Origin: v1.1.58 세션 — docs-only 티어였으나
          sauron이 R002/R010 모순 advisory 1건을 포착).
        - Wiki resync + manifest reseed (R022) run AFTER the deep-verify substitute for this tier (self-review checklist, plus the mandatory mgr-sauron R017 delegation when `.claude/rules/**` is in scope) and any resulting corrections have landed — never in parallel with it; this is the implement step's #1688 EXCEPTION applied to Tier 1. Wiki pages summarize the rules, so a review-driven rule fix invalidates any wiki written earlier (v1.1.66: 3 pages reworked; v1.1.67 with review-first ordering: 0 rework — #1688 Iteration 3 #2).
        - Log: "[compression-mode] docs-only compression activated (scope={n}, all docs/yaml labels)"
        - ⚠ Analysis artifacts only. Every step's state-change side effect (milestone create/assign,
          label add/remove, issue assign/comment/close) still runs in full — see "Cross-tier —
          State-Change Side Effects Are NEVER Compressed" below.

      ## Tier 2 — lite (intermediate)

      Evaluate ONLY if docs-only NOT met. Conditions (ALL must hold):
      1. scope size ≤ 7
      2. ALL scoped issues are low-risk: for EVERY issue,
         labels ∩ {documentation, automated, claude-code-release, feedback, professor, enhancement, improvement} ≠ ∅
      3. NO scoped issue carries a breaking-change or decision-needed label
      4. No code logic change is expected — work is docs/rule/skill/config/script-centric
         (verify against each issue body; if any issue implies application code logic change, FAIL the lite check)

      If met → set compression_mode=lite
        - triage step: MAY replace professor-triage skill spawn with orchestrator integrated analysis
        - plan step: MAY replace release-plan skill spawn with orchestrator integrated analysis
        - deep-plan step: MAY replace deep-plan skill spawn with orchestrator integrated analysis
          (except when scope contains a security/availability issue — see the Cross-tier
          「Lightweight Skill-Mode Substitution」 restriction below, which forbids this
          substitution for such issues)
        - deep-verify step: perform via mgr-sauron R017 structural verification + core self-check (split standard: see the deep-verify step description — R017 spawn + change-type adversarial review, one single-goal delegation each)
          (instead of full deep-verify skill spawn). If the change set has NO structural surface
          (no agent/skill/guide/rule frontmatter changed — e.g. a workflow-yaml-only or docs-only change),
          the mgr-sauron R017 spawn MAY be skipped and replaced by deterministic self-check
          (template-sync + md5 multi-copy + counts + bun test), under a MANDATORY justification log:
          "[compression-mode] lite deep-verify — R017 spawn skipped (no structural surface); deterministic self-check only".
          (#1311, extends #1309 substitution principle.)
        - Wiki resync/reseed only after deep-verify (adversarial review) findings are applied — same ordering rule as Tier 1; this overrides the implement-step CI-mimic wiki fix for rules/skills text changes (see the implement step's #1688 EXCEPTION) (#1688).
        - implement / verify-build / release / ci-check / post-release-followup: execute normally (no compression)
        - MANDATORY justification log (REQUIRED whenever a skill stage is replaced by integrated analysis):
          "[compression-mode] lite — skill 단계 통합 분석 대체. 정당화: scope={n}, 모든 이슈 저위험(라벨 {labels}), 구현 대상 이슈 본문 명시 {issue_refs}"
        - If the justification cannot be stated concretely (e.g., a stage cannot be safely integrated),
          do NOT compress that stage — fall back to full skill spawn for it.
        - ⚠ "통합 분석 대체" replaces analysis output ONLY. Every step's state-change side effect
          (milestone create/assign, label add/remove, issue assign/comment/close) still runs in full
          — see "Cross-tier — State-Change Side Effects Are NEVER Compressed" below.

      ## Tier 3 — standard (fallback)

      If neither docs-only nor lite met → set compression_mode=standard
        - All pipeline steps execute normally with full skill spawns — EXCEPT the two
          Cross-tier exceptions below ("Pre-Existing Converged Artifact Substitution" and
          "Lightweight Skill-Mode Substitution"), which stay available under standard mode too
          when their own conditions are met ("Independent of the tier selected above").
        - Log: "[compression-mode] standard mode (scope={n}, mixed/high-risk labels, large scope, or code logic change)"

      ## Cross-tier — State-Change Side Effects Are NEVER Compressed

      Compression (docs-only / lite) substitutes ANALYSIS ARTIFACTS ONLY. A step's
      STATE-CHANGE SIDE EFFECTS — milestone create/assign, label add/remove, issue
      assign, issue comment, issue/milestone close — are NOT analysis output and MUST
      be performed regardless of compression mode. "통합 분석 대체" replaces how the
      step THINKS, never what the step CHANGES.

      A step is not a monolith: "skip the professor-triage skill spawn" does NOT
      authorize skipping that step's gh state mutations. Before compressing any step,
      consult the inventory below and execute every side effect it lists.

      ### Step side-effect inventory (state changes; MUST run in every compression mode)

      | Step | State-change side effects (MANDATORY regardless of compression_mode) |
      |------|---------------------------------------------------------------------|
      | pre-triage | `gh label create in-progress / verify-ready / needs-review --force` (idempotent label bootstrap) |
      | scope-selection | Milestone 3-branch state machine (Step 0): closed → HALT / open → reuse / absent → `gh api repos/{owner}/{repo}/milestones --method POST`. Then: assign every scoped issue to that milestone. |
      | compression-mode-eval | none (pure evaluation + justification logs) |
      | triage | `verify-ready` added to manifest issues selected by professor-triage when it runs inside this step (NOT `triage-complete`) — analysis output is compressible, this label side effect is not; when triage is skipped (docs-only) or substituted (lite integrated-analysis, lightweight mode), no separate label action is required here — the implement step's per-issue success path (row below: "On success: remove in-progress, add verify-ready") already adds `verify-ready` to each processed issue before this release completes |
      | plan | none (analysis only) — compressible |
      | deep-plan | none (analysis only) — compressible |
      | implement | `gh issue edit <N> --add-label in-progress --add-assignee @me`; `gh issue comment <N>` (start notice); on success remove in-progress + add verify-ready; on failure remove in-progress + add needs-review + comment error summary |
      | verify-build | none (gate only) |
      | deep-verify | none (analysis only) — compressible |
      | release | PR body MUST carry `Closes #N` for every resolved issue (auto-tag.yml greps the PR body); non-auto-tag projects additionally: `gh api .../milestones/{n} --method PATCH --field state=closed`, `gh issue close {n}`, label needs-review issues "Deferred from v{version}" |
      | ci-check | `gh issue edit <N> --remove-label in-progress` for stale labels; `gh issue edit <N> --remove-label verify-ready` for THIS release's CLOSED scoped issues only (past closed issues excluded, #1734) |
      | post-release-followup | new issue registration for release follow-ups (genuine defects auto-registered, no-ask per R016) |

      Only the rows marked "none (analysis only)" are compressible. Any step with a
      non-empty side-effect cell executes those effects in FULL under docs-only and lite.

      Origin: #1553 찐빠 #3 — v1.1.41 릴리즈에서 lite 압축이 scope-selection의
      "마일스톤 미존재 → 생성" 분기까지 함께 생략해 마일스톤이 만들어지지 않았다.
      압축 대상은 분석 산출물이었으나 상태 변경 분기가 동반 생략됐다.

      ## Cross-tier — Pre-Existing Converged Artifact Substitution

      Independent of the tier selected above, an INDIVIDUAL planning/verification step (triage / plan / deep-plan / deep-verify) MAY be satisfied by a pre-existing converged artifact instead of a fresh skill spawn — even in standard mode — when ALL of the following hold for that step:
      1. A scoped issue carries (in its body or a linked artifact) a CONVERGED research/plan output equivalent to the step's skill — e.g. a `/research` multi-team analysis that explicitly converged, a `/deep-plan` artifact, or a prior `professor-triage`/`release-plan` output.
      2. The artifact covers the scoped issues' domain (not stale or unrelated).
      3. The substitution is for a PLANNING/VERIFICATION step ONLY — never for implement, verify-build, release, or ci-check.
      4. When the artifact is a SAME-SESSION triage/plan output substituting for `deep-plan` (or `plan`),
         every implement-stage delegation prompt MUST instruct the agent to re-locate targets by ANCHOR
         (function name / unique string) and treat any line numbers in the issue body or artifact as
         reference only. Line numbers go stale across release commits — v1.1.60: #1647 cited lines
         346-348 from v1.1.59, but the script had grown 608→733 lines and two agents had to re-search
         (#1652 #3-1/#3-2). The justification log MUST name the artifact AND state that anchor-based
         re-measurement was included in the delegation prompts.

      If substituted, emit a MANDATORY justification log naming the artifact:
        "[compression-mode] step '{step}' satisfied by converged artifact {ref} (substitution); skill spawn skipped"
      If the artifact's convergence or domain coverage cannot be concretely asserted, do NOT substitute — spawn the skill.

      This authorizes, under an audit log, a substitution that would otherwise be a standard-mode contract deviation. Origin: #1309 (a converged `/research` artifact was used in place of triage/plan/deep-plan under standard mode without an authorizing rule).

      ## Cross-tier — Lightweight Skill-Mode Substitution

      Independent of the tier selected above, the triage / plan / deep-plan skill spawns MAY be
      replaced by orchestrator-integrated analysis — a lightweight mode — even in standard mode,
      ONLY when ALL of the following hold. deep-verify is NOT eligible for this lightweight-mode
      substitution (see NEVER list below) — it remains eligible only for the separate
      pre-existing-converged-artifact substitution described above (a full prior skill spawn's
      output reused, not orchestrator-integrated shortcutting).
      1. Scope size ≤ 3 issues (이슈에 코드 근거가 있고 범위가 이슈 3건 이하이면 경량 모드,
         #1721 제안 4 — 사용자 결정: 상한 3건).
      2. For EVERY scoped issue in this substitution, EITHER the issue body cites concrete code
         evidence (a file path AND an anchor — function name / unique string, not just a claim),
         OR the orchestrator has recorded the measured root cause together with the exact
         command used to measure it (scope=1 + 오케스트레이터 실측 원인 확정 조건의 감사 로그
         대체 조항, #1727 찐빠 #1).
      3. A MANDATORY justification log line is emitted naming the step and the evidence basis:
         "[compression-mode] lightweight skill-mode substitution — step '{step}', scope={n},
         evidence={file:anchor or measured-cause+command}".
      4. The resulting artifact explicitly states its own mode (`mode: full` or
         `mode: lightweight`) so downstream steps and reviewers can tell it apart from a full
         skill spawn (결과물에 모드를 표시, #1721 제안 4).

      Additional restriction — security/availability scope (#1733 찐빠 #9): if ANY scoped issue
      carries the `security` label, OR its title/body explicitly states a security/availability
      concern (e.g. rate limiting, resource exhaustion, injection, denial-of-service — this repo
      has no separate `availability` label; measured via `gh label list`, so an availability
      concern must be asserted in the issue text, not inferred from a label), this lightweight
      substitution is FORBIDDEN for deep-plan on that issue — AND compression-mode-eval Tier 2
      lite's deep-plan integrated-analysis substitution is also FORBIDDEN for it; deep-plan MUST
      run as a full skill spawn. Because deep-plan is a single release-scoped step (not run
      per-issue), when ANY scoped issue qualifies, this restriction applies to the whole
      release's deep-plan step. The entry-point audit for such an issue MUST include an
      "executions per request (amplification)" check — how many downstream operations a single
      request can trigger (e.g. GraphQL alias batching, N+1 fan-out) — not only a per-call
      timeout/rate-limit check. (GraphQL document fuzz testing is OUT of scope here.)

      This substitution is NEVER available for implement, verify-build, release, ci-check, or
      deep-verify.
      It replaces analysis output ONLY — every step's state-change side effect still runs in
      full regardless of substitution (see "Cross-tier — State-Change Side Effects Are NEVER
      Compressed" above).

      If any condition above cannot be concretely asserted, do NOT substitute — spawn the skill.

      ## Output

      compression_mode ∈ {docs-only, lite, standard} as pipeline state for downstream steps.
    description: "Evaluate compression tier (docs-only/lite/standard); set compression_mode state"
    depends_on: scope-selection

  - name: triage
    skill: professor-triage
    description: "Cross-analysis triage with priority assessment (scoped to release manifest) — invoke professor-triage WITH the release manifest issue numbers from scope-selection's output as input; in this auto-dev context, manifest issues receive `verify-ready` (not `triage-complete`) per the side-effect inventory above — skipped if docs-only, integrated-analysis allowed if lite; independent of tier, MAY run in lightweight mode when compression-mode-eval's 'Cross-tier — Lightweight Skill-Mode Substitution' conditions are met"
    depends_on: compression-mode-eval

  - name: plan
    skill: release-plan
    description: "Release unit plan from triaged issues — skipped if docs-only, integrated-analysis allowed if lite; independent of tier, MAY run in lightweight mode when compression-mode-eval's 'Cross-tier — Lightweight Skill-Mode Substitution' conditions are met"
    depends_on: triage

  - name: deep-plan
    skill: deep-plan
    description: "Research-validated implementation plan (research → plan → verify) — skipped if docs-only, integrated-analysis allowed if lite; independent of tier, MAY run in lightweight mode when compression-mode-eval's 'Cross-tier — Lightweight Skill-Mode Substitution' conditions are met. MULTI-PHASE: 스킬을 그대로 spawn하지 말고 R020 「위임 경계를 Phase 개수로 설계」에 따라 단일 목표 위임으로 분할해 순차 발주한다 (#1595 #4). 리서치·계측 위임의 완료 조건에는 결론 수치를 산출물 표에서 jq/awk로 재계산해 병기하도록 명시한다(#1707 #4). 테스트 격리·모듈 모킹 수정을 다루는 리서치·계획 위임에도 대상 src 파일과 All files의 수정 전후 커버리지를 동일 하네스로 비교하도록 완료 조건에 명시합니다(#1778 찐빠 #5, implement 스텝 Rules와 동일 요구). 적용 경계 표에는 각 행마다 이 위치를 읽는 위임 유형/단계 열을 두고 결함이 발생한 단계와 일치하는지 표에서 대조합니다(#1781 찐빠 #2). 기본값·출력 리터럴을 바꾸는 계획은 그 리터럴을 단언하는 기존 테스트를 git grep으로 전수 열거해 웨이브 표의 파일 소유권에 포함합니다(git grep은 untracked 파일을 보지 못하므로 git status --porcelain도 확인합니다, #1786 찐빠 #5)."
    depends_on: plan

  - name: implement
    prompt: |
      Execute the deep-plan output for the scoped release manifest.

      Per-issue lifecycle:
      1. Start: gh issue edit <N> --add-label in-progress --add-assignee @me
      2. Comment: gh issue comment <N> --body "Implementation started via auto-dev pipeline"
      3. Dispatch specialist agents per file domain:
         - Detect file types in scope and route to matching agent
         - Use specialized agents (lang-*, be-*, fe-*, infra-*) over general-purpose
      4. TDD via superpowers:test-driven-development when tests apply
      5. Commit via mgr-gitnerd with `Refs #<N>` trailer in body — NEVER `Fixes`/`Closes`/`Resolves` (#1542).
         Commit trailers MUST use ONLY the exact trailer text the orchestrator supplies in the
         delegation prompt — the agent MUST NOT add or rewrite any other trailer (observed in
         another project's session: a subagent added an unapproved model-attribution trailer to 4
         local commits, citing the repo's own past-commit convention as justification; the trailer
         did not remain on the target branch because the squash-merge specified the PR body
         separately) (#1728 찐빠 #6). This holds even when the agent's own environment or system
         instructions suggest a different attribution: it uses the delegation's string verbatim
         (#1778 찐빠 #2).
         ⚠ implement-stage commits land directly on develop (no PR gate here). A close-keyword trailer on a
         develop-bound commit auto-closes the issue on push — BEFORE release/tag/publish (observed v1.1.38,
         07:49:26Z). Close keywords belong ONLY in the release-stage PR body (see release step 3.b) — auto-tag.yml
         greps the PR body, not commit messages, to decide which issues to close.
             ⚠ Bash timeout (#1645): the main-worktree `.husky/pre-commit` runs typecheck + lint +
             the FULL `bun test --coverage` suite (~165s measured) before the commit lands. The Bash
             tool's default timeout is 120000ms, so a `git commit` delegation with the default budget
             is killed mid-hook with exit 143 (SIGTERM). Delegate `git commit` with an explicit
             `timeout: 400000` (≈6.7 min). Do NOT work around a timeout with `--no-verify` — that
             bypasses the quality gate and is on the standing deny list (R010).
             Note: git worktrees run typecheck only (`.husky/pre-commit` lines 7-12 branch on
             `[ -f .git ]` and exit 0), so the long budget matters most on the MAIN worktree.
             OPTION: the implement-stage commit MAY be deferred until AFTER deep-verify
             corrections have landed, combining the implement changes and the deep-verify
             corrections into ONE commit (정정 커밋 추가 비용 절감, #1727 찐빠 #4) — allowed
             ONLY before any push to develop, and MUST be announced to the user. The deferred
             commit still carries the `Refs #<N>` trailer and the 400000ms timeout above. Risk:
             verify-build and deep-verify then run against an uncommitted working tree until the
             combined commit lands. DEADLINE: the combined commit MUST land — with the
             `.husky/pre-commit` gate passing — before the release step begins; release step
             1.a requires a clean working tree, so a deferred commit cannot cross into release.
             LABEL TIMING: when this OPTION is used, the moment right after the combined commit
             lands is the per-issue "success" point — run lifecycle item 6 (`gh issue edit <N>
             --remove-label in-progress --add-label verify-ready`) there for every issue in the
             commit, at that point rather than deferring it to ci-check, whose step 5 remains the
             safety net (통합 커밋 직후에 이슈별 라벨 전환을 실행합니다, #1760 찐빠 #6).
      6. On success: remove in-progress, add verify-ready (combined-commit OPTION: right after the combined commit lands, #1760 찐빠 #6)
      7. On failure: remove in-progress, add needs-review, comment error summary

      Rules:
      - Parallel execution per R009 (max 4 concurrent, respect dependencies)
      - Issues whose prerequisites failed in-run MUST be skipped (log reason)
      - No direct orchestrator writes (R010)
      - All Agent tool calls MUST pass mode: "bypassPermissions" to prevent permission prompts during unattended execution
      - Mid-run scope additions (a new issue added via user interrupt AFTER implement began) MUST re-enter the verify-build gate before release — do NOT let a late-added scope item ride to release on a prior verify-build pass. Critical for code changes; benign for docs-only (#1301).
      - When an implement-stage delegation edits rule/skill/guide TEXT, the orchestrator MUST NOT author the final committed wording — the subagent writes it directly from the issue body (`gh issue view <N> --json body`); the delegation prompt supplies pointers, insertion anchors, constraints, verbatim tool-output quotations, and measured facts only
        (R010 「출처 인용과 인접 문구 점검도 같은 규율」 보강 2항목, #1698 #1). The orchestrator's own requirement/scope summary counts as final wording too — copy the issue's proposal sentence from `gh issue view` output verbatim, and tag any orchestrator paraphrase "[요약 — 원문 우선]"
        (#1701 #1). The orchestrator's own wiring judgement (which file/anchor already covers a
        new clause) counts as final wording too — the prompt supplies candidate files/anchors
        only, and the subagent decides coverage by quoting the covering sentence (R010 [#1704 #1]).
        Non-issue sources (더루키 회상, 메모리, 다른 프로젝트 관측) MUST be placed in a separate
        block labeled with its source (e.g. `[출처: 더루키 회상 — <project>]`) and MUST NOT be
        mixed into issue-quote sentences — completion criteria MUST state this separation
        explicitly, applying to every orchestrator-authored delegation, all tiers (R010 「출처
        인용과 인접 문구 점검」 확장, #1735 찐빠 #1).
      - A release that bundles ≥2 `feedback`-type issue proposals MUST produce a per-proposal
        application-boundary table (exceptions, deadlines, tiers/steps) during plan/deep-plan or
        its lightweight tier substitute, applying to lite and standard tiers, and
        implement-stage delegation prompts MUST carry the relevant boundary row for each edit
        (회고 제안 묶음 릴리즈의 통합 분석에 적용 경계 표 필수, #1735 찐빠 #4).
        The table MUST include a column naming which delegation type/step reads each target
        location and be checked against the step where the defect occurred; a mismatch means
        the clause must also be placed at the location that step reads (#1781 찐빠 #2).
      - Before dispatching any delegation prompt in an iteration that created or reinforced a rule
        clause, the orchestrator MUST compare that clause's Anti-pattern table rows 1:1 against the
        delegation prompt's sentences and rewrite any match (cause: the R016 「신설 조항의 동일
        반복 self-check」 was known as text but not executed as a procedure, #1707 #1).
      - A delegation whose convention/doc text describes an implementation choice made in the SAME
        release (e.g. a test-writing convention that depends on how a mock-leak fix is
        implemented) MUST be dispatched sequentially, AFTER the implementation report arrives —
        file-disjoint is not independent when the wording depends on an undecided implementation
        choice (R009 「File-Disjoint ≠ Independent」 document-implementation variant); docs
        independent of any in-release implementation choice may still run in parallel
        (같은 릴리즈의 구현 선택을 서술하는 규약·문서 위임은 구현 보고를 받은 뒤 순차 발주합니다,
        #1763 찐빠 #2).
      - Every rule/skill/guide TEXT-editing delegation prompt MUST include this fixed constraint
        block: (a) Korean 합쇼체 for new sentences, do not imitate adjacent 반말 — completion
        criteria MUST include THREE deterministic checks, scoped to edited text files (md/yaml)
        and restricted to added lines only (`git diff -U0 -- <edited md/yaml files> | grep
        '^+'`): family check `grep -cE '(한다|된다|않는다|따른다|했다|있다|없다|넣는다|이다)[.。 "(]'`
        = 0, line-final auxiliary check `grep -E '다[.。"]?$' | grep -vcE '니다[.。"]?$'` = 0
        (the family list alone misses endings such as 따른다/했다/있다 and unpunctuated
        line-final endings; the line-final check excludes 합쇼체 `-니다` endings so it does not
        flag correct sentences — the second grep MUST use `-E`: in BRE `?` is a literal
        character, so the original `grep -vc` form flagged all 6 합쇼체 negatives (6/12 correct,
        re-measured #1760); with `-vcE` the 6 반말/평서형 positive and 6 합쇼체 negative samples
        give 12/12 correct) (#1711 찐빠 #3), AND line-final noun-ending check
        `grep -E '(함|됨|필요)[.。"]?$'` = 0 (반말/명사 종결 endings such as 확인함·정정
        필요·완료됨 fall entirely outside the 다-ending regexes above and were previously
        undetectable — verified against 4 명사 종결 positive samples and 4 합쇼체 negative
        samples, 8/8 correct) (#1728 찐빠 #2 residual). The earlier unverified "macOS multibyte
        false positive" hypothesis is retired: the cause measured in #1763 찐빠 #1 for the
        grep/python3 disagreement was the missing `-E` on the second grep (in BRE `?` is a literal
        character), not a platform effect (re-measured 12/12 with `-vcE`; this text entered via commit 54f92b85, Refs #1760 — not in #1760's issue body). This repo's
        Bash `grep` MAY still be a shell function shadowing the real binary (R005) — the agent MUST ALSO run the same three checks as a
        python3 `re` equivalent of all THREE checks above, reading from the SAME piped stdin as
        (a) (`git diff -U0 -- <edited md/yaml files> | grep '^+' | python3 -c "import re,sys;
        text=sys.stdin.read();
        fam=len(re.findall(r'(한다|된다|않는다|따른다|했다|있다|없다|넣는다|이다)[.。 \"(]', text));
        lf=len(re.findall(r'다[.。\"]?$', text, re.M)) - len(re.findall(r'니다[.。\"]?$', text, re.M));
        noun=len(re.findall(r'(함|됨|필요)[.。\"]?$', text, re.M));
        print(fam, lf, noun)"`, NOT a file-argument read — the input is the piped diff, never a
        file path), in ADDITION to (not instead of) the grep commands above, and
        treat a python3/grep disagreement as a trigger to investigate, not as a known false
        positive: on the FIRST observation the agent MUST reproduce the cause within that same
        iteration (e.g. run each check on a printf positive/negative fixture and report which
        command or flag differs) and MUST NOT dismiss it with a `[hypothesis]` tag
        (grep/python3 불일치가 처음 관측되면 그 반복 안에서 원인을 재현으로 가릅니다, 가설 태그로
        넘기지 않습니다; R005, R023, #1749 찐빠 #3, #1763 찐빠 #1). Even with all three checks, a residual
        gap remains for 반말/명사 종결 variants the patterns above do not enumerate — the agent
        MUST also read the newly added lines directly as a final check, not rely on regex alone.
        When an edit re-emits a pre-existing
        line unchanged in meaning (e.g. reformatting), judge only the newly added span, not the
        whole re-emitted line; (b) locate by anchor
        strings, never line numbers; (c) copy quotations from `gh issue view --json body` output and
        verify with `grep -F`; (d) ±1 heading check including re-binding of relative references (위
        표/아래 표/직전 조항); (e) copy to `templates/` mirror and confirm `md5 -q` equality (#1707 #3);
        (f) when paraphrasing a quoted source, preserve its result word, subject, and causal
        direction (결과어·주체·인과 방향 보존) — this is checked SEPARATELY from the `grep -F`
        lexical match, by placing the paraphrase and the original sentence side by side in the
        completion report (#1711 찐빠 #1); (g) version/count example values written
        into rule/skill text use placeholders, never real literals (룰 예시 값은 플레이스홀더,
        실값 리터럴 금지) — the rule corpus is itself a grep target, and a real literal can
        contaminate the very command a clause cites (#1711 찐빠 #2); (h) any temporary file the
        delegation creates MUST live under a per-agent-unique path (`$TMPDIR` or the session
        scratchpad), never a fixed shared path (#1722 찐빠 #7). This governs the agent's own
        ad-hoc temp files; temp paths created at runtime by test code are governed by the
        separate test-code temp-path bullet below (#1778 찐빠 #4); (i) when the edit writes a runnable
        command or code snippet into rule/skill/guide/workflow text, the agent MUST copy that command OUT of the
        edited file and run it on a positive and a negative fixture, putting both raw outputs in the
        completion report (the #1752 fixture bullet below, carried here so it reaches the prompt;
        #1781 찐빠 #1).
      - Any implement-stage delegation that writes an executable command or code snippet into
        rule/skill/guide/workflow TEXT (not a prose-only edit) MUST require, as a completion-report
        item, that the agent copy the command OUT of the edited file and run it once on a positive
        fixture (the check-triggering case) and once on a negative fixture (the check-passing
        case), reporting both raw outputs (룰/스킬/워크플로 텍스트에 넣는 실행 명령은 편집 파일에서
        그대로 복사해 양성·음성 픽스처로 실행한 출력을 완료 보고에 포함해야 합니다; 정정 위임은 이미
        적용해 통과한 결과로 갈음합니다) (R023 「Sample-Value Assembly」, #1752 찐빠 #1).
      - The fixture-execution norm above (copy the command OUT of the edited file and run it,
        reporting raw output) extends to CI workflow scripts (e.g. GitHub Actions YAML steps)
        being verified during implement/verify-build/deep-verify: when the agent extracts a step
        into a runnable copy to verify it, edits to that copy are LIMITED to execution-environment
        substitution ONLY (e.g. disabling `sleep`, or pointing a summary-output target such as
        `$GITHUB_STEP_SUMMARY` at a local file) — the step's logic and echo/output text MUST
        remain exactly as written in the source file (editing a step's command line to fake a
        network response is a logic edit; if a response must be simulated, do it via the
        environment, e.g. a PATH shim, never by editing the step's lines), and the completion
        report MUST show the RAW fixture output, not a summarized or paraphrased rendering (CI
        워크플로 스크립트를 사본으로 추출해 검증할 때 사본 수정은 `sleep` 무력화·요약 출력 대상
        지정처럼 실행 환경 대체로만 제한하고 로직·echo 문구는 원문 그대로 유지하며, 완료 보고에는
        요약이 아닌 raw 출력을 포함해야 합니다) (R023 「Sample-Value Assembly」, #1754 찐빠 #2).
      - A delegation that creates or edits TS/JS files located inside biome's configured scope
        (the `files.includes` globs in `biome.json`, currently `src/**`, `tests/**`, `scripts/**`)
        MUST include in its completion criteria `bunx biome check <the target files>` (the local
        counterpart of the CI Lint job for those paths, R023 「Delegated Verification Floor」) with
        the raw exit code reported. For TS/JS files outside that scope (e.g. `packages/**`,
        `.github/scripts/**`) the same command exits 1 regardless of formatting because the path
        is ignored, so the agent MUST NOT report that exit as a lint failure and MUST NOT work
        around it: it reports those files as "outside biome scope" instead. Read-only review
        delegations are excluded (biome 설정 범위 안의 TS/JS 파일을 만들거나 고치는 위임의 완료
        조건에 대상 파일의 `bunx biome check`를 포함합니다. 범위 밖 파일은 실패로 보고하지 않고
        "biome 범위 밖"으로 보고합니다, #1778 찐빠 #3).
      - A delegation that writes test code MUST instruct the agent that temp paths created at
        runtime by that test code come from `mkdtempSync(join(tmpdir(), …))` (or the language's
        equivalent), and that a session scratchpad path MUST NOT be hardcoded in the code. This
        applies to every test-writing delegation, not only rule/skill/guide TEXT edits (이 규범은
        테스트 코드를 작성하는 모든 위임에 적용됩니다, #1778 찐빠 #4).
      - Every delegation prompt (not only rule/skill/guide TEXT edits) MUST instruct the agent
        that if a guard, classifier, or permission check blocks an action, it MUST NOT route
        around it (e.g. via a shell glob or path rewrite) — it MUST stop and report the block
        verbatim (R010 「품질 게이트 우회 금지 — 훅 차단은 보고 대상」, extended here from git
        hooks to guards/classifiers/permissions generally) (#1728 찐빠 #1).
      - Every delegation prompt MUST instruct the agent not to use a persistent `cd` in the
        Bash tool, and the orchestrator itself MUST NOT use one: use absolute paths or a subshell
        `( cd … )`, because a bare `cd` stays as the session cwd: hook commands are anchored with
        `CLAUDE_PROJECT_DIR` and unaffected, but scripts/tools that read relative paths internally
        and later commands' relative paths can break (see
        the R005 clause on Bash `cd` remaining as the session cwd, #1778 찐빠 #1, #1767).
      - The standard wording of STATE-CHANGING delegation prompts (git/gh commands,
        file-creating and file-editing delegations — NOT read-only review/analysis delegations) MUST instruct
        the agent to report ONLY what it directly observed within its own execution context, and
        MUST NOT narrate history it did not itself observe (e.g. asserting a branch/file
        "originally didn't exist" or "already had unrelated uncommitted changes before this
        session" without having checked) — where the delegation prompt's context leaves a gap, the
        agent MUST state it as "not observed" rather than fill it by inference (상태 변경 위임서의 표준 문안에 "직접 관측한
        것만 보고하고, 관측하지 않은 이력은 서술하지 말 것"을 포함해야 합니다) (R020 「보유
        실측값과 어긋나는 서브에이전트 서술은 즉시 정정」, R010, #1754 찐빠 #1).
      - No state-changing command (`gh issue create/edit/close`, `gh pr create/edit/close/merge`,
        `git push`, label changes) — including the orchestrator's own direct commands, not only
        delegated ones — MAY use a `||` fallback that prints success-looking output; the observed
        failure mode was a failed `gh issue create` followed by a `||` fallback that printed a
        DIFFERENT issue's URL, which the orchestrator briefly read as a successful create
        (#1735 찐빠 #2). Exceptions: a `||` fallback whose output is explicitly marked as
        failure (e.g. `|| echo "::warning::…"`, a literal `MISS` token) and idempotent bootstrap
        commands (no `||` success masking) such as `gh label create --force 2>/dev/null`.
      - After any delegation that creates temporary files under constraint (h) above, the
        orchestrator MUST confirm with `git status --short` that no stray file was left in the
        repo (#1721 찐빠 #7).
      - Document mirror/parity delegations (README/ARCHITECTURE/CLAUDE.md ko-en, templates
        mirrors, etc.) MUST be split to ≤3 files per delegation (a companion cap alongside the
        arithmetic below, not a replacement for it); compute turn arithmetic (files × 3 +
        edit_items × 2 ≤ 16 — a #1709-proposed guide kept below the 20-turn limit, not a
        truncation guarantee, per R020 「maxTurns 절단 실증」 6항) and state that arithmetic in
        the delegation prompt before dispatch (#1709 #1). Any edit delegation requiring
        verification of N quotations or identifiers (not only claude-code-release CC-note
        delegations) MUST perform that verification with batched command(s) (a single loop or
        combined `grep -F` pass over all N items), never per-item invocations, and the turn
        arithmetic above MUST add a batched-verification term — ⌈N/batch⌉ — still an
        upper-bound guide that may still truncate, not a truncation guarantee (검증 비용을
        턴 산술에 반영, R020 「maxTurns 절단 실증」 6항 확장, #1737 찐빠 #1).
      - A single-file edit delegation (of any type, not only rule/skill/guide TEXT edits) whose
        target file is ≥1,000 lines (measure `wc -l`) MUST either (i) split "본문 편집" (body edit) from "미러 복사·검증·
        보고" (mirror copy, verification, and completion report) into separate delegations (under (i) the body-edit delegation does no mirror copy; the second
        delegation performs "미러 복사 → 검사·보고" in that order as its first step, per the
        procedure-order bullet below), or
        (ii) add a large-file fixed-cost term to the turn arithmetic above — a large-file edit
        can exceed what the arithmetic assumes even when the item count stays small; read-only
        review delegations are excluded (대형 파일 편집 위임 20턴 절단 재발 방지, R020
        「maxTurns 절단 실증」, R009, #1749 찐빠 #1).
      - Every text-edit delegation MUST add an inspection fixed cost to the turn arithmetic
        above (합쇼체 checks and each exhaustive grep ≈ 1 turn each), whether or not the target
        has mirrors. A text-edit delegation whose target has mirrors (templates copies, ko/en
        pairs, or the 4-copy workflow set) MUST additionally fix the procedure order "본문 편집 →
        즉시 미러 복사 → 검사·보고" in the delegation prompt, so a truncation can no longer leave
        mirror drift behind; under option (i) of the ≥1,000-line bullet above, the body-edit
        delegation does no mirror copy and the second delegation runs "미러 복사 → 검사·보고" in
        that order as its first step, while under option (ii) (single delegation) the full order
        applies (텍스트 편집 위임은 모두 턴 산술에 검사 고정비를 더하며, 미러가 있는 대상은
        본문 편집 직후 미러를 복사하고 그다음에 검사와 보고를 진행합니다 — 턴 산술이 편집
        항목만 세고 검사·보고 준비 비용을 반영하지 않던 문제와 미러 복사가 절차 맨 끝에 있어
        절단 시 미러 드리프트가 남던 문제 방지, R020 「maxTurns 절단 실증」, #1757 찐빠 #2).
      - A delegation that adds rows to a table MUST include as a completion item a per-cell
        source table for each new row (every cell mapped 1:1 to a source sentence); a cell
        without a source is written "—" and never copied from an adjacent row; prose-only
        edits are excluded (표 행 추가 위임의 완료 조건에 새 행의 모든 셀을 출처 문장과 1:1로
        대응시킨 표를 넣으며, 근거가 없는 셀은 "—"로 둡니다 — 인접 행을 복사해 새 행을 만드는 과정에서
        근거 없는 셀과 바뀐 주어가 유입되던 문제 방지, R023, R010 「출처 인용과 인접 문구 점검도 같은 규율」, #1757 찐빠 #3).
      - Parity delegation prompts (e.g. a ko mirror tracking an en source) MUST require THREE
        directions — additions, edits, AND deletions — to match the source, never additions
        only; completion criteria MUST include a `grep -F` confirming zero rows/sentences are
        present in the target but absent from the source (#1709 #2).
      - When a delegation prompt or brief states a measured version/count value (CC version,
        rule-note coverage ceiling, file/skill counts), append the exact command used to
        measure it (e.g. `claude --version`=X / `git grep -oh '2\.1\.2[0-9][0-9]'
        .claude/rules | sort -V | tail -1`=Y) so the subagent can distinguish a CLI-install
        version from a rule-corpus coverage ceiling (#1709 #3).
      - Before delegating an edit/commit to an EXISTING file (not a newly-created target, which
        is by definition untracked), confirm the path is git-tracked via `git ls-files <path>`
        — not just existence via Glob/ls. An existing-but-untracked path — verify with
        `git check-ignore -v --no-index <path>` to confirm intentional exclusion (e.g. a
        `.gitignore` rule) — MUST be excluded from delegation scope, or its tracked status
        decided first, before dispatch (R010 「Agent Capability Pre-Check」 git-tracked row)
        (#1709 #4).
      - When forwarding a number OR an identifier (file path, rule number, issue number) an
        agent reported into a subsequent delegation prompt, recompute the number once via
        diff/ls (e.g. `git diff -U0 -- <path> | grep -c '^+[^+]'`) AND re-check the
        identifier once via a corpus-wide grep of the reported CONTENT key, not the reported
        identifier itself (e.g. if an agent reports "<rule-N> covers <content key>", grep the
        content key — `git grep -n '<content key>' .claude/rules/` — not `<rule-N>`) and
        compare the file/rule where that content actually lives against the reported identifier
        before restating either — do not relay an unverified agent-reported count or identifier
        (R023 「리서치 위임의 결론 수치는 표에서 재계산해 병기」 #1707 #4 확장, #1709 #5, #1722
        찐빠 #3).
      - Delegations that create files, binaries, worktrees, or branches (artifact-creating
        delegations only — text-only edits are excluded) MUST include measured output in their
        completion report — `file <bin>` for binaries, `ls -la <path>` for created paths, `git
        worktree list` for worktrees, `git branch --list` for branches, as applicable — and the
        orchestrator MUST confirm architecture/path from that measured output before using the
        artifact, not from the agent's self-report alone (R020 Subagent Self-Report
        Verification, #1733 찐빠 #1). (#1733 찐빠 #1's third proposal — never use haiku for
        worktree/cross-compile delegations — is not added separately here: R006
        (`.claude/rules/MUST-agent-design.md`) already scopes `haiku` to "Fast, cheap tasks
        (search, simple edits)", which excludes multi-step build/worktree work.)
      - Delegations that build or replace an evaluation/test harness or a production code path
        (fixtures, ablation lanes, scoring/oracle logic) MUST require bidirectional proof, not
        a single-direction pass: (a) positive AND negative fixtures — a fixture set that can
        both pass and fail, and for a replaced code path, invalid-input fixtures compared
        against the original's rc/stderr, not just valid-input stdout parity; (b) a control —
        the change MUST be measured before AND after together with the SAME harness (대조군:
        변경 전후를 함께 측정, #1721 찐빠 #1) — this before/after measurement is MANDATORY, not
        an example; reverting the change to confirm the result flips, or a synthetic
        positive-control input returning a non-zero candidate/hit count, are additional means
        of proving the harness can detect an effect at all, not substitutes for the before/after
        measurement; (c) no working around a discovered product or measurement defect to force
        a pass — halt and report instead (R023 「Conditional-Output Verification」 양성/음성 짝
        원칙 확장, #1721 찐빠 #1, #1727 찐빠 #2, #1728 찐빠 #2).
      - A delegation that adds an item to an existing list or loop (e.g. a sync-file list) MUST
        require, as a completion item, citing with file:line how that list handles preserveFiles,
        protection and backup contracts, and judging whether the new item is consistent with the
        other components in the same run (#1786 찐빠 #1).
      - A delegation that writes migration/upgrade tests MUST require, as a completion item, that
        every "old state" fixture be derived from that version's generator output (or real tagged
        artifacts; cite the call used), never hand-written from source expressions (#1786 찐빠 #2).
      - Delegations (research or implementation) that design or fix test isolation or module
        mocking MUST include in their completion criteria a before/after coverage comparison
        of the target src file(s) AND the All-files total, measured with the SAME harness
        (a fix that passes an order experiment can still drop coverage below the gate,
        #1778 찐빠 #5).
      - Delegations that inject faults / modify-then-restore files — not limited to harness
        builds — MUST back up the original file under `bak/<repo-relative-path>` (the full
        repo-relative path, not filename-only) nested under the session scratchpad or `$TMPDIR`
        (not inside the repo, to stay consistent with constraint (h) above), and a checksum
        comparison after restore is MANDATORY. A `git diff`-based patch approach is also allowed.
        `git stash` is otherwise allowed EXCEPT when parallel delegations share the working tree
        (R009 「File-Disjoint ≠ Independent (Local Git State)」), where it MUST NOT be used
        (#1733 코멘트 찐빠 #8).
      - For `claude-code-release` issues, CC release knowledge goes to
        `guides/claude-code/15-version-compatibility.md` (+ templates mirror) per rule; a rule
        file gets at most ONE line of behavioral norm only when agent behavior must change.
        Delegations correcting a CC-note (a note the issue claims is wrong) MUST enclose the
        upstream CHANGELOG lines (measured with `grep -nF`) and the original target paragraph
        as ground truth; if the issue's premise differs from the primary source, the primary
        source wins and the discrepancy is reported rather than silently inherited into the
        corrected wording (#1730 찐빠 #1). A `claude-code-release` delegation prompt that writes
        a count sentence (e.g. "기타 N건") MUST specify, in the prompt itself, the exact counting
        range (which section of the issue body to count) and the exact measurement command; the
        resulting guide/rule text MUST carry that same command alongside the number — delegations
        that produce no count sentence are excluded (계수 구간 정의 부재로 인한 수치 오류 방지,
        R023 「리서치 위임의 결론 수치는 표에서 재계산해 병기」, R020, #1749 찐빠 #2).
      - A `claude-code-release` delegation's quotation verification (`grep -F`) MUST target a
        file cut to that version's CHANGELOG section only, never the whole CHANGELOG (example
        cut, `<X.Y.Z>` is a placeholder: `awk -v v="<X.Y.Z>" '/^## /{p=($2==v)} p'
        CHANGELOG.md > <section-file>`; an empty <section-file> means the version is absent and
        the delegation MUST stop and report) (인용 검증 대상은 해당 버전 절만 잘라낸 파일로
        지정합니다 — 원문에 있는지와 이 버전의 원문인지를 같은 검사로 취급하면 다른 버전
        문장이 섞여도 통과하므로, #1757 찐빠 #4).
        For a bundled multi-version note (R017 「묶음 버전 노트 위임서 — 문장별 (NNN) 태그와 합쇼체 예시」), cut one section file per version and verify each quote against its own version's file.
      - Any delegation correcting a fact (the issue states an existing statement in a target file
        is wrong) — not only `claude-code-release` CC-notes — MUST include, as a completion
        criterion, an exhaustive `grep` across the target file(s) for the claim's key terms, not
        only the single string anchor supplied in the prompt, so a second copy of the same claim
        elsewhere in the file is also caught; pure additions (no existing statement is being
        corrected) are excluded (앵커 1개 한정으로 인한 동일 주장 잔존 사본 방지, R010 「출처
        인용과 인접 문구 점검」, R022, #1749 찐빠 #4).
      - When review-correction work is split across file-ownership delegations (one file per
        agent), every split delegation prompt MUST carry the FULL list of review findings
        (not only the subset touching that agent's file) as a self-check list, so a fix in one
        file does not reintroduce a defect the review flagged in a sibling file (#1730 찐빠
        #2).
      - Delegations adding visible text to `CLAUDE.md`/`.claude/rules/*.md` MUST keep the
        comment-stripped total ≤140,000 chars (hard limit 150,000, validate-docs
        `--programmatic-only`) — retire/DETAIL-wrap something else in-change if needed (R016
        버전노트 보존정책 / 예산 게이트, #1717). Any delegation that compresses or conceals rule
        text (DETAIL-wrapping, retirement) MUST deterministically confirm that every visible
        approval/prohibition/MUST sentence present in the file at HEAD is semantically still
        present in the new visible text afterwards (의미상 남았는가) — a visible-text-to-visible-
        text comparison, not a summary-vs-summary one, using a deterministic method: per-sentence
        `grep -F` of key phrases from each of HEAD's visible approval/prohibition/MUST sentences
        against the new comment-stripped text (#1722 찐빠 #1).


      ## Sensitive Path Handling (CC v2.1.121+)

      Direct Write/Edit/Bash on `.claude/**` is permitted under `mode: "bypassPermissions"` as of CC v2.1.121 (#1101). The legacy `/tmp/*.sh` bypass is no longer required. Structural changes (new agents/skills) still go through mgr-creator with R017 verification.

      For CC < v2.1.121 see git history for the legacy bypass pattern.

      ## Local CI-mimic verification (MUST run before marking implement done)

      After all implementation tasks complete, run these scripts in sequence and halt on failure.
      Run each standalone (NO pipe) and read its exit code directly — `$?` after a pipe is the last command's code (R005, #1492):

      1. bash .github/scripts/verify-template-sync.sh
      2. bash .github/scripts/verify-wiki-sync.sh
      3. bun .github/scripts/validate-docs.ts --programmatic-only

      If any fails:
      - For wiki-sync failures: delegate to wiki-curator to generate missing pages (`/omcustom:wiki ingest <path>`)
        (Regenerating the wiki source-hash manifest targets `wiki/.source-hashes.json` ALWAYS — NEVER `templates/manifest.json`. Command: `bash .github/scripts/lib/source-hash.sh generate wiki/.source-hashes.json`. Ref #1423.)
      - EXCEPTION (#1688 ordering): when the change set is rules/skills TEXT only (no new or renamed entity), do NOT fix wiki drift here — record the drift and defer the wiki resync + `wiki/.source-hashes.json` reseed until AFTER deep-verify findings are applied, then re-run `verify-wiki-sync.sh` before release. Missing PAGES for newly created entities are still generated here (CI blocks on them).
      - For template-sync failures: delegate to mgr-updater to sync `.claude/` -> `templates/.claude/`
      - For validate-docs failures (count mismatch): delegate to mgr-updater to fix counts via EXHAUSTIVE grep across all docs — file-enumeration misses `.en`/`.ko` variants and secondary docs (#1521 — v1.1.32에서 validate-docs 누락으로 push 왕복 1회 발생)
      - After fixes, re-run the scripts until all pass

      This mirrors CI and prevents the known 1-2 wasted push cycles per release (ref: issue #927, v0.98.0 PR #925).
    description: "Per-issue implementation with lifecycle, specialist routing, and CI-mimic verification"
    depends_on: deep-plan

  - name: verify-build
    prompt: |
      Project-specific build + test verification.

      For Node/Bun projects (this repo):
      1. bun install — verify lockfile sync (halt on lockfile drift)
      2. bun run lint (if package.json has lint script)
      3. bun run typecheck (if available)
      4. bun test — MANDATORY, no silent skip
         - Baseline reference: #1156 historically documented 86 failures; v0.136.2 fixes resolved them → current baseline = 0
         - Each release: adopt prior version's test result as baseline (dynamic, not hardcoded)
         - Compute current pass/fail counts
         - If current FAIL count > baseline → NEW regression detected → halt + report failure list
         - If current FAIL count <= baseline → continue with advisory log "X failures (baseline {n}, delta {d})"
      5. Build verification (if package has build script)
      6. Coverage threshold check (equivalent to `.husky/pre-commit`'s coverage gate — this
         step exists so that a deferred implement-stage commit, per the implement step 5
         OPTION, is still coverage-gated before release even though the hook has not run yet):
         - bun test --coverage — standalone (NO pipe), read exit code directly
         - Extract Function/Line coverage from the "All files" summary line
         - Read the CURRENT threshold value and the new-source-file relaxation rule directly
           from `.husky/pre-commit` at run time — do NOT hardcode a threshold number in this
           workflow; the hook's threshold can change independently of this file
         - If either Function or Line coverage falls below the threshold `.husky/pre-commit`
           currently applies (accounting for its dynamic relaxation for commits containing
           newly added `src/**/*.ts`/`.tsx` files): halt + report the shortfall

      For Python/Go/Docker/static-site projects: auto-detect and run equivalent (py_compile + pytest / go build + go vet + go test / docker build / file validation).

      Halt conditions:
      - Lint errors (exit != 0)
      - Typecheck errors
      - NEW test failures (regression from baseline)
      - Coverage below the threshold `.husky/pre-commit` currently applies
      - Build failure
      - Lockfile drift

      Halt → report exact command + stderr + delta details. Do NOT proceed to release on any halt.
    description: "Auto-detected build + test verification (bun test with baseline delta guard)"
    depends_on: implement

  - name: deep-verify
    skill: deep-verify
    description: "Multi-angle release quality verification — self-review checklist if docs-only; mgr-sauron R017 + core self-check if lite. MULTI-PHASE: 스킬을 그대로 spawn하지 말고 R020 「위임 경계를 Phase 개수로 설계」에 따라 단일 목표 위임으로 분할해 순차 발주한다 (#1595 #4). lite 분할 표준(#1652 #3-4): (1) mgr-sauron R017 구조 검증 단일 목표 위임 1건 + (2) 변경 성격별 적대적 리뷰 단일 목표 위임 1건 — 스크립트 변경이면 실행 재현 기반 adversarial-review, 룰/스킬/yaml 텍스트 변경이면 문구 정합·배선 리뷰. 훅·advisor 옵션 변경이면 합성 픽스처 외에 이 프로젝트 실 트랜스크립트 1건 계수 실측을 완료 조건에 포함(#1703 권장 2). 근거: v1.1.59/60 두 반복 연속 적대적 리뷰가 신규 회귀(M-3/M-4, heredoc 위조)를 실행 재현으로 포착. 검증 위임 표준 문안: 오케스트레이터가 이미 실측한 항목(bun test·lint·typecheck·template-sync·wiki-sync·validate-docs·미러 md5)은 위임서에 재실행 금지 목록으로 열거하고 재실측 대상만 지정한다 — v1.1.61 세션에서 금지 목록 없는 sauron 위임이 bun test를 재실행하다 25턴 절단됐고, 금지 목록을 명시한 재위임은 16 tool_uses로 완주했다(R020 maxTurns 절단 누적 7건째). 검증 위임도 편집 위임과 동일하게 턴 산술(대상 파일 수 × 판단 항목 수)을 계산해 위임서에 명시하고, 예산을 넘으면 파일군별로 분할해야 합니다 — v1.1.77 sauron 1차 위임은 30여 파일 + 판단 4항목을 단일 위임에 넣어 판정 없이 25턴에서 절단됐습니다(#1722 찐빠 #2). Ordering: any wiki resync/manifest reseed for the changed rules/skills is dispatched after this step's findings are applied, not alongside it (#1688)."
    depends_on: verify-build

  - name: release
    prompt: |
      Create a GitHub Release.

      0a. User-execution constraint check (mandatory, before step 0, #1733 찐빠 #2): read
          CLAUDE.md, session memory, and the entry card (if the environment provides one, e.g. a
          recall entry card) for any user-execution constraint (e.g. "merge/tag/publish must be
          run by the user, not the agent"). For each command this release step is about to run:
          if it is COVERED by a constraint (merge, tag, publish), do NOT execute it — present the
          exact command(s) to the user and STOP this step; if it is NOT covered (e.g. branch
          creation, version bump, PR creation — coverage is judged by the scope of the constraint
          text actually found in CLAUDE.md/session memory, not by this example list), proceed
          normally. No matching constraint found → unchanged behavior, proceed to step 0. User decision
          (recorded): in an unattended run (`/fsd` etc. — see pre-triage Phase 0.6
          `unattended_mode`), STOP at the first covered command, present it to the user, and HOLD
          the convergence declaration until the user runs it and confirms.

      0. Pre-check (mandatory, delegate to mgr-gitnerd per R010): Detect and remove stale local `release` branch if present.
         The local `release` branch (file ref) conflicts with `release/v*` directory ref namespace.
         mgr-gitnerd executes (force-delete acceptable in automation context; warns if branch has unpushed commits):
           if git show-ref --verify --quiet refs/heads/release; then
             # Check for unpushed commits before force-delete
             if [ -n "$(git log refs/heads/release ^origin/develop --oneline 2>/dev/null)" ]; then
               echo "::warning::Local 'release' branch has unpushed commits — force-deleting anyway"
             fi
             git branch -D release
           fi
         Reference: issue #1141 (v0.135.0 follow-up), mgr-gitnerd MEMORY.md.

      1. Version bump (mandatory):
         Orchestrator delegates to mgr-updater (R010) for the file edits below; mgr-gitnerd (R010) for branch/commit/push.
         Determine NEW version per semver rules below FIRST — before touching any file.

         ⚠ Branch-before-bump (#1542, observed v1.1.38): for npm project with auto-tag.yml (this repo), the
         version-bump commit MUST be created ON release/v{NEW}, and MUST NOT be pushed to develop directly.
         Pushing the bump commit to develop before branching leaves develop and release/v{NEW} pointing at the
         SAME commit → PR diff=0 → `gh pr create` fails with "GraphQL: No commits between develop and
         release/v{NEW}". Evidence: PR #1538 (v1.1.37) and PR #1534 (v1.1.36) each contain exactly ONE commit
         (the bump commit) — proof the bump belongs on the release branch, never on develop directly.

         npm project (package.json exists):
           a. mgr-gitnerd: git checkout develop && git pull origin develop
              (R017 Pre-Branch Freshness Gate — ensures local develop holds every merged feature commit before branching)
           b. mgr-gitnerd creates release/v{NEW} branch from develop and checks it out — BEFORE any edit in c–i below.
              (This is the step that used to run AFTER the bump in step 3.a of the old ordering — moving it here
              is the #1542 fix. Do NOT perform steps c–i on develop.)
           c. package.json: jq '.version = "<NEW>"' package.json > package.json.tmp && mv package.json.tmp package.json   [on release/v{NEW}]
           # ⚠ jq '.version=...' PRESERVES the manifest structure {version, lastUpdated, omcustomMinClaudeCode, components[]}.
           #   Edit ONLY the .version field — do NOT overwrite templates/manifest.json wholesale (e.g. a source-hash path→hash map).
           #   Recover a corrupted manifest: git show HEAD:templates/manifest.json | jq '.version="<NEW>"' > templates/manifest.json (#1423/#1154).
           d. templates/manifest.json: jq '.version = "<NEW>"' templates/manifest.json > templates/manifest.json.tmp && mv templates/manifest.json.tmp templates/manifest.json   [on release/v{NEW}]
           e. ⚠ PREREQUISITE: steps c (package.json) AND d (templates/manifest.json) MUST BOTH be completed
              before running this step. bun run build — run standalone (NO pipe), read exit code directly
              ($? after a pipe is the last command's, R005/#1492).
              Actual mechanism (corrected, #1593): `bun run build` invokes `scripts/sync-source-lockfile.ts`
              (a 10-line wrapper with no version literals of its own), which calls
              `generateAndWriteLockfileForDir` (`src/core/lockfile.ts`). That function reads versions via
              `loadVersions()` (`src/core/sync.ts`) — `generatorVersion` FROM package.json, `templateVersion`
              FROM templates/manifest.json — and writes both into .omcustom.lock.json. If step d has not yet
              landed when this runs, the lockfile silently records the PREVIOUS templateVersion — no warning,
              no error. Observed contamination: v1.1.47 shipped generatorVersion=1.1.47 / templateVersion=1.1.46
              because the bump commit created package.json + lockfile together and manifest.json was bumped in
              a later commit. Do NOT run this step until BOTH c and d are staged.   [on release/v{NEW}]
              ⚠ Recap (R017 「버전 범프 원자 순서」, #1619 #4, v1.1.50 실측): package.json과 templates/manifest.json을 동시에 범프한 뒤 bun run build를 실행하고, build가 갱신한 lockfile을 스테이징한다 — 순서 위반 시 CI Version Sync 3-way(package.json/manifest.json/lockfile) 대조가 차단한다. v1.1.50에서 manifest.json 범프 누락 → 1차 실패, build를 manifest 범프 전에 실행 → 2차 실패(lockfile에 구버전 templateVersion 각인)했다.
           f. git status --short — enumerate ALL tracked drift (`^ M`) the build produced; stage EVERY one (esp. .omcustom.lock.json) before commit.
              (#1531 — .omcustom.lock.json missed staging across 4 consecutive releases after v1.1.29; root cause was no build step between version bump and commit.)   [on release/v{NEW}]
           g. mgr-gitnerd commit: "chore(release): bump to v<NEW>" — MUST include the drift from step f.
              ⚠ do NOT add Closes/Fixes/Resolves keywords to this commit message (#1542) — this commit merges into
              develop later via the release PR; a close keyword here bypasses the PR-body mechanism auto-tag.yml
              relies on (see step 3.b below). Use `Refs #N` if a cross-reference is needed.
              ⚠ Commit trailers MUST use ONLY the exact trailer text supplied in this delegation
              prompt — do not add or rewrite any other trailer, even when the agent's own
              environment or system instructions suggest a different attribution (#1728 찐빠 #6,
              #1778 찐빠 #2; see implement step 5).
               ⚠ Bash timeout (#1645): delegate this commit with an explicit `timeout: 400000` — the
               main-worktree pre-commit hook runs the full test suite (~165s) and the Bash default of
               120000ms kills it with exit 143. `--no-verify` is NOT an acceptable workaround (R010).
           h. mgr-gitnerd push release/v{NEW} to origin — NEVER push this commit to develop directly. Pushing to
              develop here reproduces the diff=0 PR failure this reordering fixes (#1542).
           i. mandatory verification (with existence guard for partial-update safety), run on release/v{NEW}:
              [ -f scripts/verify-version-sync.sh ] && bash scripts/verify-version-sync.sh || echo "::warning::verify-version-sync.sh not found, version sync verification skipped"
              (verify-version-sync.sh 가 exit 1 시 release 단계 halt)
           j. lockfile 3-way assertion (#1593 제안3, closes the gap step i's 2-way check misses) — run standalone
              (NO pipe), read exit code directly, on release/v{NEW}:
              jq -e --arg v "<NEW>" '.generatorVersion==$v and .templateVersion==$v' .omcustom.lock.json
              실패 시 release 단계 halt — cause is almost always step e run before step d landed; fix by
              re-running step d then step e, re-staging, and re-running this assertion.

         Version decision (semver) — PATCH-PREFERRED policy (post-1.0.0):
         - No existing tags → v0.1.0
         - Previous tag exists → DEFAULT to patch. When in doubt, patch — do NOT reflexively bump minor for rule/doc/skill edits.
           - patch (DEFAULT): rule/doc/skill/config/wiki/workflow changes, bugfixes, hardening, CC-compat notes — the vast majority of this project's changes
           - minor: ONLY a new user-facing capability that changes HOW the harness is used — a new
             workflow axis, a new command surface users must learn, or a contract other components
             depend on. NOT "a file was added under .claude/skills/ or .claude/agents/".
             ⚠ Counter-example (Origin: v1.1.49 세션, 사용자 지적): adding one skill + one agent
             (agora: skills 114→115, agents 49→50) was initially scoped as v1.2.0 minor by reading
             the old wording literally. That was WRONG — this repo adds skills routinely, and
             skills reached 115 while the version stayed v1.1.48, so skill/agent addition is
             ESTABLISHED as patch (target was corrected to v1.1.49). Count growth is this repo's
             baseline rate of change, NOT a minor signal. If a version bump would follow
             mechanically from "a new file exists", it is patch. Ask instead: does a user's
             workflow change because of this?
           - major: breaking changes to user-facing contracts (CLI flags, public skill/command names, public API), or a deliberate milestone declaration (e.g., v1.0.0)
         - Previous tag is ahead of source version (e.g., tag v0.136.1, package.json 0.136.0): use next available skip-version (0.136.2)

      2. Release notes via omcustom-release-notes skill
      3. Adapt release mechanism to project (determines how steps 3-5 execute):
         - npm project with auto-tag.yml (this repo — release/v* PR pattern):
           a. release/v{NEW} branch + version-bump commit were already created in step 1.b–1.h above — do NOT
              re-create the branch or re-run the bump here; this step only opens the PR against the existing branch.
           b. mgr-gitnerd creates PR: gh pr create --base develop --head release/v{NEW} --title "chore(release): bump to v{NEW}" --body "<MUST include 'Closes #N' for EVERY issue this release resolves>"
              ⚠ auto-tag.yml closes issues by grep'ing Closes/Fixes/Resolves keywords in the PR BODY — NOT by milestone membership NOR by commit message trailers. If the keywords are missing, no issues close and the workflow still reports success (#1531). Commit-message close keywords are explicitly forbidden during `implement` and step 1.g above (#1542) — the PR body is the ONLY place a close keyword should appear.
              Before creating the PR (whether via inline --body or --body-file), confirm the body text actually contains a Closes line per issue.
           c. mgr-gitnerd merges PR: gh pr merge {n} --merge --delete-branch (plain merge — NOT --admin).
              Ground-truth (measured 2026-08-15, `gh api repos/{owner}/{repo}/branches/develop/protection`):
              required status checks are exactly 6 — Test, Lint, Template Sync, Version Sync,
              Dependency Security Audit, Rust Tests (strict=true); enforce_admins=false; NO
              required_pull_request_reviews (no reviewer-approval requirement exists). v1.1.47 merged with a
              plain `gh pr merge 1585 --merge --delete-branch` — no --admin needed. A plain merge succeeds
              once all 6 checks report green. If the merge is rejected, do NOT reflexively add --admin —
              re-run the protection query above to re-measure current requirements and report the actual
              blocker (R010 bypass-flag pre-check: name what is bypassed and why before ever using --admin).
           d. DO NOT manually git tag or gh release create.
              auto-tag.yml fires on release/v* PR merge → creates tag → closes issues linked via PR-body Closes/Fixes/Resolves keywords → closes milestone → deletes release branch.
              release.yml fires on the tag → npm publish + GitHub Release creation.
           Milestone close and issue close are handled downstream by auto-tag.yml — do NOT close them manually.
           After merge, verify each targeted issue is actually CLOSED (gh issue view); close manually if still open. Workflow conclusion=success is not evidence of close (#1531 — v1.1.34 Closes-keyword omission left 5 issues open, manual close required).
         - Non-npm / no auto-tag.yml:
           mgr-gitnerd: git tag v{NEW} && git push origin v{NEW}
           mgr-gitnerd: gh release create v{NEW} (with release notes)
           Then proceed with items 4-5 below.

      4. Close milestone (non-auto-tag projects only — auto-tag.yml handles this for npm+PR projects):
         gh api repos/{owner}/{repo}/milestones/{n} --method PATCH --field state=closed

      5. Close verify-ready issues (non-auto-tag projects only — auto-tag.yml handles this for npm+PR projects):
         gh issue close {n} --comment "Fixed in v{version}"
         Label needs-review issues as "Deferred from v{version}"

      6. npm publish verification (npm projects only):
         After auto-tag.yml + release.yml complete (verified in ci-check step):
         npm view <pkg> version → must equal v{NEW}
    description: "Git tag + GitHub Release + close milestone/issues (with mandatory version sync verification)"
    depends_on: deep-verify

  - name: ci-check
    prompt: |
      Post-release CI verification.

      1. Check if .github/workflows/ has CI workflows
         If NOT: skip with "No CI configured. Skipping." and continue.
      2. If CI exists:
         - gh run list --limit 10
         - Wait for runs triggered by the new tag/push — poll WITHIN the Bash timeout budget
           (loop_count × sleep_interval + command time ≤ timeout, with margin), or prefer a
           single bounded call `gh run watch <run-id> --exit-status` (optionally
           run_in_background) over an unbounded manual poll loop (#1711 찐빠 #6).
         - Any wait/poll loop in this step, including a release-publish package-availability
           wait, MUST print one progress line per iteration (attempt count, current observed
           value) so a long-but-normal wait is not mistaken for a stall — a single bounded
           `gh run watch`/`gh pr checks --watch` call already streams periodic status, which
           serves the same anti-stall purpose and satisfies this requirement without extra
           instrumentation (#1752 찐빠 #2).
         - If failures: diagnose, fix, re-verify
      3. For npm projects with auto-tag.yml: MANDATORY additional check:
         gh run list --workflow auto-tag.yml --limit 1 --json conclusion,displayTitle
         ⚠ auto-tag.yml run의 `headSha`는 **release 브랜치 head(PR head SHA)**이지 머지 커밋이 아니다 — 폴링 종료
         조건을 머지 커밋 SHA로 걸면 영원히 미일치해 타임아웃까지 전량 소진한다(v1.1.61 세션 실측: 40회/10분 전량
         소진, v1.1.62에서 PR head로 정정 → 22회 정상 종료). release.yml run은 `displayTitle`에 PR 번호/브랜치명이
         들어가므로 그것으로 식별한다.
         → conclusion MUST be "success" before declaring release complete.
         If auto-tag.yml concluded "failure": diagnose root cause. Do NOT retry with manual git tag.
         Common causes:
           - Tag already exists (manual tag pushed before PR merge — fix: remove manual tag from release delegation)
           - Branch naming mismatch (branch not matching release/v* pattern — fix: verify branch name)
         Report: "[ci-check] auto-tag.yml: {conclusion}" as mandatory line in CI status report.
      4. For npm projects: verify npm publish succeeded (npm view <pkg> version)
      5. Verify every scoped issue's label/state lifecycle landed: `in-progress` removed and
         the issue CLOSED for each issue that was in this release's scope — do not rely on the
         implement step having run the lifecycle transition; check directly with
         `gh issue view <N> --json state,labels` (#1722 찐빠 #6, closes gap where CLOSED issues
         retained `in-progress`). This step finds AND fixes, not verify-only: if a stale
         `in-progress` label remains, remove it (`gh issue edit <N> --remove-label
         in-progress`) and report the fix; if the issue is still OPEN, do NOT close it here —
         closing stays with auto-tag.yml unless it failed to close that issue, in which case
         report the open issue for manual close per release step 3.d above (#1722 하네스 제안
         4). Additionally, for each scoped issue that IS closed by THIS release, remove a
         lingering `verify-ready` label if present (`gh issue edit <N> --remove-label
         verify-ready`) — scoped to THIS release's closed issues only; bulk-removing
         `verify-ready` from previously closed issues is explicitly excluded (user decision,
         #1734).
      6. Report final CI status.
    description: "Post-release CI verification and fix loop"
    depends_on: release

  - name: post-release-followup
    skill: post-release-followup
    description: "Register follow-ups from this release as new issues"
    depends_on: ci-check
